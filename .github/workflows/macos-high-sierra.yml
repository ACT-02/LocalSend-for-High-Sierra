      # ============================================================
      # Final runtime-gate audit. A green build is not accepted unless:
      #   - every Mach-O declares macOS <= 10.13
      #   - no Objective-C-visible Swift class in the final bundle uses the
      #     10.15-era stable-Swift class discriminator; 10.13 requires the
      #     legacy discriminator
      #   - no binary imports post-10.13 libobjc helpers directly
      #     from system libobjc
      #   - FlutterMacOS's two known helpers are bound to HSObjC
      # ============================================================

      - name: Enforce High Sierra Mach-O and libobjc compatibility
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../diagnostics

          python3 - "$APP" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          target = (10, 13, 0)

          def parse_version(value):
              parts = [int(part) for part in value.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          violations = []
          scanned = 0

          for path in app.rglob("*"):
              if not path.is_file():
                  continue

              file_result = subprocess.run(
                  ["file", str(path)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )

              if "Mach-O" not in file_result.stdout:
                  continue

              scanned += 1

              output = subprocess.check_output(
                  ["otool", "-l", str(path)],
                  text=True,
              )

              versions = []
              for pattern in (
                  r"cmd LC_VERSION_MIN_MACOSX.*?\bversion\s+([0-9.]+)",
                  r"cmd LC_BUILD_VERSION.*?\bminos\s+([0-9.]+)",
              ):
                  match = re.search(pattern, output, flags=re.DOTALL)
                  if match:
                      versions.append(match.group(1))

              if not versions:
                  violations.append(
                      f"NO_DEPLOYMENT_MARKER :: {path.relative_to(app)}"
                  )
                  continue

              for version in versions:
                  if parse_version(version) > target:
                      violations.append(
                          f"MINOS_{version} :: {path.relative_to(app)}"
                      )

          report = Path("../diagnostics/deployment-violations.txt")
          report.write_text("\n".join(violations) + ("\n" if violations else ""))

          print(f"Scanned {scanned} final Mach-O files.")

          if violations:
              print("ERROR: final bundle contains non-High-Sierra Mach-O files:")
              print("\n".join(violations))
              raise SystemExit(1)

          print("PASS: every final Mach-O deployment marker is <= macOS 10.13.")
          PY

          # Final bundle Dart VM policy audit. This is intentionally independent
          # of the earlier engine-backport step so artifact packaging cannot
          # silently replace FlutterMacOS with an unpatched copy.
          python3 - "$APP/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS" <<'PY'
          import struct
          import sys
          from pathlib import Path

          binary = Path(sys.argv[1])
          blob = binary.read_bytes()
          CPU_TYPE_X86_64 = 0x01000007
          MH_MAGIC_64 = 0xFEEDFACF
          LC_SEGMENT_64 = 0x19
          expected_sites = {
              0x00A087DB: bytes.fromhex("81f9b38b0100"),
              0x00A08845: bytes.fromhex("41b80d000000"),
          }

          def find_slice(data):
              magic = data[:4]
              if magic == b"\xca\xfe\xba\xbe":
                  n = struct.unpack_from(">I", data, 4)[0]
                  for i in range(n):
                      ct, _st, off, _sz, _al = struct.unpack_from(
                          ">IIIII", data, 8 + i * 20
                      )
                      if ct == CPU_TYPE_X86_64:
                          return off
              elif magic == b"\xca\xfe\xba\xbf":
                  n = struct.unpack_from(">I", data, 4)[0]
                  for i in range(n):
                      ct, _st, off, _sz, _al, _r = struct.unpack_from(
                          ">IIQQII", data, 8 + i * 32
                      )
                      if ct == CPU_TYPE_X86_64:
                          return off
              elif struct.unpack_from("<I", data, 0)[0] == MH_MAGIC_64:
                  return 0
              raise SystemExit("ERROR: final FlutterMacOS has no x86_64 slice.")

          base = find_slice(blob)
          ncmds = struct.unpack_from("<I", blob, base + 16)[0]
          off = base + 32
          segments = []
          for _ in range(ncmds):
              cmd, size = struct.unpack_from("<II", blob, off)
              if cmd == LC_SEGMENT_64:
                  vmaddr, _vmsize, fileoff, filesize = struct.unpack_from(
                      "<QQQQ", blob, off + 24
                  )
                  segments.append((vmaddr, fileoff, filesize))
              off += size

          def vm_to_file(addr):
              for vmaddr, fileoff, filesize in segments:
                  if vmaddr <= addr < vmaddr + filesize:
                      return base + fileoff + (addr - vmaddr)
              raise SystemExit(f"ERROR: final Dart gate address {addr:#x} is not file-backed.")

          for addr, expected in expected_sites.items():
              fileoff = vm_to_file(addr)
              actual = blob[fileoff:fileoff + len(expected)]
              if actual != expected:
                  raise SystemExit(
                      "ERROR: final bundle does not contain the Dart VM macOS 10.13 "
                      f"gate patch at {addr:#x}: {actual.hex()} != {expected.hex()}"
                  )

          print(
              "PASS: final bundled Dart VM accepts macOS 10.13 and still rejects "
              "macOS 10.12 and older."
          )
          PY

          # Re-run the Swift two-level namespace audit against the final bundled
          # FlutterMacOS. This catches packaging or later Mach-O edits that could
          # silently restore /usr/lib/swift/libswiftDarwin.dylib and recreate the
          # High Sierra lazy-binding failure.
          python3 ../diagnostics/audit_flutter_swift_ordinals.py \
            "$APP/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS" \
            "$APP/Contents/Frameworks" \
            ../diagnostics/final-FlutterMacOS.swift-ordinal-audit.txt

          # High Sierra's Objective-C runtime understands the pre-stable Swift
          # class discriminator (bit 0), not FAST_IS_SWIFT_STABLE (bit 1).
          # Source-built targets already get the legacy form from the compiler
          # because their deployment target is genuinely 10.13. Audit the whole
          # final bundle so a future prebuilt framework cannot silently re-add
          # stable-Swift class metadata.
          python3 - "$APP" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          objdump = subprocess.check_output(
              ["xcrun", "--find", "llvm-objdump"],
              text=True,
          ).strip()

          violations = []
          swift_images = []

          for path in app.rglob("*"):
              if not path.is_file():
                  continue

              file_result = subprocess.run(
                  ["file", str(path)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              if "Mach-O" not in file_result.stdout:
                  continue

              result = subprocess.run(
                  [objdump, "--macho", "--objc-meta-data", str(path)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )

              flags = []
              for match in re.finditer(
                  r"^\s*data\s+0x([0-9a-fA-F]+)\s+Swift class\s*$",
                  result.stdout,
                  re.MULTILINE,
              ):
                  flags.append(int(match.group(1), 16) & 0x7)

              if not flags:
                  continue

              relative = path.relative_to(app)
              legacy_count = sum(1 for flag in flags if flag & 0x1)
              stable_count = sum(1 for flag in flags if flag & 0x2)
              swift_images.append(
                  f"{relative} :: legacy={legacy_count} stable={stable_count}"
              )

              if stable_count:
                  violations.append(
                      f"{relative} :: stable-Swift appearances={stable_count}"
                  )

          Path("../diagnostics/swift-objc-metadata-audit.txt").write_text(
              "\n".join(swift_images) + ("\n" if swift_images else "")
          )
          Path("../diagnostics/stable-swift-metadata-violations.txt").write_text(
              "\n".join(violations) + ("\n" if violations else "")
          )

          print(f"Objective-C-visible Swift Mach-O images: {len(swift_images)}")

          if violations:
              print("ERROR: final bundle still contains stable-Swift class metadata:")
              print("\n".join(violations))
              raise SystemExit(1)

          print(
              "PASS: every Objective-C-visible Swift class in the final bundle "
              "uses High Sierra-compatible legacy metadata."
          )
          PY

          # Validate the exact dylib-version contract that High Sierra dyld
          # enforces when FlutterMacOS loads HSObjC.
          HSOBJC="$APP/Contents/Frameworks/HSObjC.dylib"
          FLUTTER_BINARY="$APP/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"

          test -f "$HSOBJC"
          test -f "$FLUTTER_BINARY"

          HSOBJC_ID_LINE="$(
            otool -L "$HSOBJC" \
              | grep -F '@rpath/HSObjC.dylib (' \
              | head -1 \
              || true
          )"

          FLUTTER_HSOBJC_LINE="$(
            otool -L "$FLUTTER_BINARY" \
              | grep -F '@rpath/HSObjC.dylib (' \
              | head -1 \
              || true
          )"

          {
            echo "HSObjC identity:"
            echo "$HSOBJC_ID_LINE"
            echo
            echo "FlutterMacOS dependency:"
            echo "$FLUTTER_HSOBJC_LINE"
          } | tee ../diagnostics/HSObjC-version-contract.txt

          if ! printf '%s\n' "$HSOBJC_ID_LINE" \
            | grep -Fq 'compatibility version 1.0.0, current version 1.0.0'; then

            echo "ERROR: HSObjC does not provide dylib version 1.0.0."
            exit 1
          fi

          if ! printf '%s\n' "$FLUTTER_HSOBJC_LINE" \
            | grep -Fq '@rpath/HSObjC.dylib'; then

            echo "ERROR: FlutterMacOS is not linked to HSObjC."
            exit 1
          fi

          # The original libobjc dependency requires compatibility version
          # 1.0.0. Keep this assertion explicit so CI catches the exact failure
          # that High Sierra dyld reported during the first real launch.
          if ! printf '%s\n' "$FLUTTER_HSOBJC_LINE" \
            | grep -Fq 'compatibility version 1.0.0'; then

            echo "ERROR: FlutterMacOS -> HSObjC requires an unexpected compatibility version."
            exit 1
          fi

          echo "PASS: HSObjC dylib version contract satisfies FlutterMacOS."

          RUNTIME_REPORT="../diagnostics/post-high-sierra-libobjc-imports.txt"
          : > "$RUNTIME_REPORT"

          find "$APP" -type f -print0 \
          | while IFS= read -r -d '' FILE; do
              if ! file "$FILE" | grep -q 'Mach-O'; then
                continue
              fi

              NM_OUTPUT="$(nm -u -m "$FILE" 2>/dev/null || true)"

              # Anything named objc_opt_* is Catalina-era. objc_alloc_init is
              # Mojave 10.14.4+. The only allowed occurrences are FlutterMacOS
              # imports whose provider has been redirected to HSObjC.
              MATCHES="$(printf '%s\n' "$NM_OUTPUT" | grep -E '_objc_alloc_init|_objc_opt_' || true)"

              if [ -z "$MATCHES" ]; then
                continue
              fi

              RELATIVE="${FILE#$APP/}"

              if [ "$RELATIVE" = "Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS" ]; then
                BAD="$(printf '%s\n' "$MATCHES" | grep -v '(from HSObjC' || true)"

                if [ -n "$BAD" ]; then
                  {
                    echo "$RELATIVE"
                    printf '%s\n' "$BAD"
                    echo
                  } >> "$RUNTIME_REPORT"
                fi
              else
                {
                  echo "$RELATIVE"
                  printf '%s\n' "$MATCHES"
                  echo
                } >> "$RUNTIME_REPORT"
              fi
            done

          if [ -s "$RUNTIME_REPORT" ]; then
            echo "ERROR: post-High-Sierra Objective-C runtime imports remain:"
            cat "$RUNTIME_REPORT"
            exit 1
          fi

          echo "PASS: no final binary directly imports post-10.13 libobjc helpers."

      - name: Inspect final code signatures
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "============================================================"
            echo "LocalSend"
            echo "============================================================"
            codesign --display --verbose=4 "$APP" 2>&1

            echo
            echo "============================================================"
            echo "LocalSend entitlements"
            echo "============================================================"
            codesign --display --entitlements - --xml "$APP" 2>/dev/null || true

            echo
            echo "============================================================"
            echo "FlutterMacOS"
            echo "============================================================"
            codesign --display --verbose=4 "$APP/Contents/Frameworks/FlutterMacOS.framework" 2>&1

            echo
            echo "============================================================"
            echo "ShareExtension"
            echo "============================================================"
            codesign --display --verbose=4 "$APP/Contents/PlugIns/ShareExtension.appex" 2>&1

            echo
            echo "============================================================"
            echo "LaunchAtLoginHelper"
            echo "============================================================"
            codesign --display --verbose=4 "$APP/Contents/Library/LoginItems/LaunchAtLoginHelper.app" 2>&1
          } | tee ../diagnostics/codesign-report.txt

          codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Package High Sierra build
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          OUTPUT="release/${HIGH_SIERRA_ASSET_BASENAME}.zip"
          CHECKSUM="${OUTPUT}.sha256"
          rm -f "$OUTPUT" "$CHECKSUM"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUTPUT"
          (
            cd release
            shasum -a 256 "${HIGH_SIERRA_ASSET_BASENAME}.zip" \
              > "${HIGH_SIERRA_ASSET_BASENAME}.zip.sha256"
          )
          ls -lh "$OUTPUT" "$CHECKSUM"
          cat "$CHECKSUM"

      - name: Upload High Sierra build
        id: upload_build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64
          path: |
            app/release/LocalSend-*-macOS-High-Sierra-10.13-x86_64.zip
            app/release/LocalSend-*-macOS-High-Sierra-10.13-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Retry High Sierra build upload
        if: steps.upload_build.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-macOS-High-Sierra-10.13-x86_64-retry
          path: |
            app/release/LocalSend-*-macOS-High-Sierra-10.13-x86_64.zip
            app/release/LocalSend-*-macOS-High-Sierra-10.13-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish High Sierra GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          if [ "$HIGH_SIERRA_SOURCE_KIND" != "official-release" ]; then
            echo "ERROR: refusing to publish non-release source kind: $HIGH_SIERRA_SOURCE_KIND"
            exit 1
          fi

          ZIP="app/release/${HIGH_SIERRA_ASSET_BASENAME}.zip"
          CHECKSUM="${ZIP}.sha256"
          test -f "$ZIP"
          test -f "$CHECKSUM"

          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          Unofficial High Sierra backport of LocalSend ${UPSTREAM_RELEASE_TAG}.

          Target:
          - macOS 10.13.6 High Sierra
          - Intel x86_64 only

          This build is produced only after the fail-closed High Sierra compatibility checks in this repository pass. It is not an official LocalSend release.

          Upstream release:
          https://github.com/localsend/localsend/releases/tag/${UPSTREAM_RELEASE_TAG}
          EOF

          if gh release view "$HIGH_SIERRA_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release edit "$HIGH_SIERRA_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LocalSend ${UPSTREAM_RELEASE_TAG} for macOS High Sierra" \
              --notes-file "$NOTES"

            gh release upload "$HIGH_SIERRA_RELEASE_TAG" \
              "$ZIP" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$HIGH_SIERRA_RELEASE_TAG" \
              "$ZIP" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LocalSend ${UPSTREAM_RELEASE_TAG} for macOS High Sierra" \
              --notes-file "$NOTES"
          fi

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics

          cp app/macos/Runner.xcodeproj/project.pbxproj diagnostics/project.pbxproj.after-patch 2>/dev/null
          cp app/macos/Podfile diagnostics/Podfile.after-patch 2>/dev/null
          cp app/macos/Podfile.lock diagnostics/Podfile.lock.after-patch 2>/dev/null
          cp app/pubspec.yaml diagnostics/pubspec.yaml.after-foss-strip 2>/dev/null
          cp app/.flutter-plugins-dependencies diagnostics/flutter-plugins-dependencies.json 2>/dev/null
          cp app/macos/Runner/Configs/Release.xcconfig diagnostics/Release.xcconfig.after-patch 2>/dev/null
          cp app/macos/Flutter/Flutter-Release.xcconfig diagnostics/Flutter-Release.xcconfig 2>/dev/null
          cp app/macos/Flutter/Flutter-Debug.xcconfig diagnostics/Flutter-Debug.xcconfig 2>/dev/null
          cp app/macos/Runner/Shared.swift diagnostics/Runner-Shared.after-patch.swift 2>/dev/null
          cp app/macos/ShareExtension/Utilities.swift diagnostics/ShareExtension-Utilities.high-sierra.swift 2>/dev/null
          cp app/macos/ShareExtension/ShareController.swift diagnostics/ShareController.high-sierra.swift 2>/dev/null
          cp flutter-config-first.log diagnostics/flutter-config-first.log 2>/dev/null
          cp flutter-config-final.log diagnostics/flutter-config-final.log 2>/dev/null
          cp flutter-macos-build.log diagnostics/flutter-macos-build.log 2>/dev/null
          cp pod-install.log diagnostics/pod-install.log 2>/dev/null
          cp pod-env.log diagnostics/pod-env.log 2>/dev/null
          cp swiftpm-resolve.log diagnostics/swiftpm-resolve.log 2>/dev/null
          cp flutter-pub-deps.txt diagnostics/flutter-pub-deps.txt 2>/dev/null
          cp flutter-podhelper.rb.original diagnostics/flutter-podhelper.rb.original 2>/dev/null
          cp "$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb" diagnostics/flutter-podhelper.rb.after-patch 2>/dev/null
          cp app/macos/Flutter/ephemeral/FlutterMacOS.podspec diagnostics/FlutterMacOS.podspec.generated 2>/dev/null

          FINAL_APP="$(find app/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -n "$FINAL_APP" ]; then
            FINAL_FLUTTER="$FINAL_APP/Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"
            FINAL_OBJECTIVE_C="$FINAL_APP/Contents/Frameworks/objective_c.framework/Versions/A/objective_c"
            FINAL_HSOBJC="$FINAL_APP/Contents/Frameworks/HSObjC.dylib"

            cp "$FINAL_FLUTTER" diagnostics/FlutterMacOS.after-backport 2>/dev/null
            cp "$FINAL_OBJECTIVE_C" diagnostics/objective_c.after-backport 2>/dev/null
            cp "$FINAL_HSOBJC" diagnostics/HSObjC.dylib 2>/dev/null
          fi

          cp native-assets-pub-deps.txt diagnostics/native-assets-pub-deps.txt 2>/dev/null
          cp diagnostics/objective_c-root.txt diagnostics/objective_c-root.txt 2>/dev/null || true

      - name: Pack diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          rm -f LocalSend-High-Sierra-build-diagnostics.zip
          if [ -d diagnostics ]; then
            ditto \
              -c \
              -k \
              --sequesterRsrc \
              --keepParent \
              diagnostics \
              LocalSend-High-Sierra-build-diagnostics.zip
          fi

      - name: Upload build diagnostics
        id: upload_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics
          path: LocalSend-High-Sierra-build-diagnostics.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Retry diagnostics upload
        if: >
          always() &&
          steps.upload_diagnostics.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-High-Sierra-build-diagnostics-retry
          path: LocalSend-High-Sierra-build-diagnostics.zip
          if-no-files-found: warn
          retention-days: 30
