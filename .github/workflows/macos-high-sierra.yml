                      return base + fileoff + (addr - vmaddr)
              raise SystemExit(f"ERROR: Dart gate audit address {addr:#x} is not file-backed.")

          for addr, expected in expected_sites.items():
              fileoff = vm_to_file(addr)
              actual = blob[fileoff:fileoff + len(expected)]
              print(
                  f"Dart VM final audit {addr:#010x}: "
                  f"{actual.hex()} expected={expected.hex()}"
              )
              if actual != expected:
                  raise SystemExit(
                      f"ERROR: Dart VM macOS 10.13 gate patch was lost at {addr:#x}."
                  )

          print("PASS: final FlutterMacOS retains the Dart VM macOS 10.13 runtime gate.")
          PY

          FRAMEWORK_PLIST="$FRAMEWORK/Versions/A/Resources/Info.plist"
          if [ -f "$FRAMEWORK_PLIST" ]; then
            if /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$FRAMEWORK_PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c 'Set :MinimumOSVersion 10.13' "$FRAMEWORK_PLIST"
            fi
            if /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$FRAMEWORK_PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion 10.13' "$FRAMEWORK_PLIST"
            fi
          fi

          python3 - "$APP" <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          libraries = [
              "libswiftCore.dylib",
              "libswiftFoundation.dylib",
              "libswiftCoreGraphics.dylib",
          ]

          def parse_version(value):
              parts = [int(part) for part in value.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          for name in libraries:
              path = app / "Contents" / "Frameworks" / name
              output = subprocess.check_output(["otool", "-l", str(path)], text=True)
              versions = []

              minimum = re.search(
                  r"cmd LC_VERSION_MIN_MACOSX.*?\bversion\s+([0-9.]+)",
                  output,
                  flags=re.DOTALL,
              )
              build = re.search(
                  r"cmd LC_BUILD_VERSION.*?\bminos\s+([0-9.]+)",
                  output,
                  flags=re.DOTALL,
              )

              if minimum:
                  versions.append(minimum.group(1))
              if build:
                  versions.append(build.group(1))

              print(f"{name}: deployment markers = {versions}")
              for version in versions:
                  if parse_version(version) > parse_version("10.13"):
                      raise SystemExit(f"ERROR: {name} requires macOS {version}.")
          PY

          codesign --force --sign - "$FRAMEWORK"

          echo "============================================================"
          echo "FlutterMacOS AFTER"
          echo "============================================================"
          otool -l "$BINARY" | awk '
            /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
            /cmd LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++; if (count >= 10) show=0 }
          '
          otool -L "$BINARY"

          if ! otool -L "$BINARY" | grep -Fq '@rpath/HSObjC.dylib'; then
            echo "ERROR: FlutterMacOS was not redirected through HSObjC.dylib."
            exit 1
          fi

          if otool -L "$BINARY" | grep -Fq '/usr/lib/libobjc.A.dylib'; then
            echo "ERROR: FlutterMacOS still loads libobjc directly instead of HSObjC."
            exit 1
          fi

          if ! otool -l "$BINARY" | grep -A4 'LC_VERSION_MIN_MACOSX' | grep -q 'version 10.13'; then
            echo "ERROR: FlutterMacOS is not marked for macOS 10.13."
            exit 1
          fi

          if otool -L "$BINARY" | grep -E '/usr/lib/swift/(libswiftCore|libswiftFoundation|libswiftCoreGraphics)\.dylib'; then
            echo "ERROR: Strong Swift system runtime dependency remains in FlutterMacOS."
            exit 1
          fi

          nm -u -m "$BINARY" > ../diagnostics/FlutterMacOS.undefined-symbols.txt 2>&1 || true

          # The symbols still exist by name, but after changing the load-command
          # ordinal they must resolve through HSObjC rather than system libobjc.
          for SYMBOL in _objc_alloc_init _objc_opt_self; do
            if ! grep -E "${SYMBOL}.*\(from HSObjC" \
              ../diagnostics/FlutterMacOS.undefined-symbols.txt; then

              echo "ERROR: $SYMBOL is not bound through HSObjC after FlutterMacOS patch."
              echo "Relevant nm output:"
              grep -E "${SYMBOL}|objc_opt_|objc_alloc_init" \
                ../diagnostics/FlutterMacOS.undefined-symbols.txt || true
              exit 1
            fi
          done

