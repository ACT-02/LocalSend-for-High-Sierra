name: LocalSend macOS High Sierra Backport

on:
  workflow_dispatch:
    inputs:
      native_assets_strategy:
        description: "Native Assets compatibility strategy"
        required: true
        default: "native-backport"
        type: choice
        options:
          - "native-backport"
          - "legacy-path-provider"
      upstream_tag:
        description: "Official LocalSend release tag associated with this build (for example v1.19.0)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish or update the High Sierra GitHub Release after all validation passes"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-high-sierra.yml"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.1"
  LEGACY_MACOS_TARGET: "10.13"
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  NATIVE_ASSETS_STRATEGY: ${{ inputs.native_assets_strategy || 'native-backport' }}
  REQUESTED_UPSTREAM_TAG: ${{ inputs.upstream_tag || '' }}
  PUBLISH_RELEASE: ${{ inputs.publish_release || false }}

jobs:
  build:
    name: Build LocalSend for macOS High Sierra
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve High Sierra build metadata
        shell: bash
        run: |
          set -euxo pipefail

          MARKER=".high-sierra/last-synced-release.txt"
          SOURCE_KIND_FILE=".high-sierra/source-kind.txt"

          test -s "$MARKER"
          test -s "$SOURCE_KIND_FILE"

          UPSTREAM_RELEASE_TAG="$(tr -d '\r\n' < "$MARKER")"
          HIGH_SIERRA_SOURCE_KIND="$(tr -d '\r\n' < "$SOURCE_KIND_FILE")"

          APP_VERSION="$(
            python3 <<'PY'
          import re
          from pathlib import Path

          text = Path("app/pubspec.yaml").read_text()
          match = re.search(r"(?m)^version:\s*([^\s]+)\s*$", text)
          if not match:
              raise SystemExit("ERROR: app version not found in app/pubspec.yaml")
          print(match.group(1))
          PY
          )"

          APP_RELEASE_VERSION="${APP_VERSION%%+*}"
          EXPECTED_TAG="v${APP_RELEASE_VERSION}"

          if [ "$UPSTREAM_RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: source marker $UPSTREAM_RELEASE_TAG does not match app version $APP_VERSION."
            exit 1
          fi

          if [ -n "${REQUESTED_UPSTREAM_TAG:-}" ] && [ "$REQUESTED_UPSTREAM_TAG" != "$UPSTREAM_RELEASE_TAG" ]; then
            echo "ERROR: requested upstream tag $REQUESTED_UPSTREAM_TAG does not match source marker $UPSTREAM_RELEASE_TAG."
            exit 1
          fi

          if [ "${PUBLISH_RELEASE}" = "true" ] && [ "$HIGH_SIERRA_SOURCE_KIND" != "official-release" ]; then
            echo "ERROR: refusing to publish a GitHub Release from source kind '$HIGH_SIERRA_SOURCE_KIND'."
            echo "Only an exact synchronized official LocalSend release may be published automatically."
            exit 1
          fi

          HIGH_SIERRA_RELEASE_TAG="${UPSTREAM_RELEASE_TAG}-high-sierra"
          HIGH_SIERRA_ASSET_BASENAME="LocalSend-${APP_RELEASE_VERSION}-macOS-High-Sierra-10.13-x86_64"

          {
            echo "UPSTREAM_RELEASE_TAG=$UPSTREAM_RELEASE_TAG"
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_RELEASE_VERSION=$APP_RELEASE_VERSION"
            echo "HIGH_SIERRA_SOURCE_KIND=$HIGH_SIERRA_SOURCE_KIND"
            echo "HIGH_SIERRA_RELEASE_TAG=$HIGH_SIERRA_RELEASE_TAG"
            echo "HIGH_SIERRA_ASSET_BASENAME=$HIGH_SIERRA_ASSET_BASENAME"
          } >> "$GITHUB_ENV"

          echo "Upstream release tag: $UPSTREAM_RELEASE_TAG"
          echo "Source kind: $HIGH_SIERRA_SOURCE_KIND"
          echo "High Sierra release tag: $HIGH_SIERRA_RELEASE_TAG"
          echo "Release asset basename: $HIGH_SIERRA_ASSET_BASENAME"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Backport FlutterMacOS podspec generator
        shell: bash
        run: |
          set -euxo pipefail
          PODHELPER="$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"
          test -f "$PODHELPER"
          cp "$PODHELPER" flutter-podhelper.rb.original

          python3 - "$PODHELPER" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "s.osx.deployment_target = '10.13'" not in text:
              text, count = re.subn(
                  r"s\.osx\.deployment_target\s*=\s*['\"]10\.15['\"]",
                  "s.osx.deployment_target = '10.13'",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      "ERROR: FlutterMacOS 10.15 deployment target not found in podhelper.rb."
                  )
              path.write_text(text)

          if "s.osx.deployment_target = '10.13'" not in path.read_text():
              raise SystemExit("ERROR: FlutterMacOS podspec generator patch failed.")
          PY

          grep -n "s.osx.deployment_target" "$PODHELPER"

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail
          flutter --version
          dart --version
          rustc --version
          cargo --version
          xcodebuild -version
          ruby --version
          pod --version
          sw_vers
          uname -a
          uname -m
          xcrun --find vtool
          xcrun --find install_name_tool

      - name: Remove in-app purchases
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          pubspec = Path("app/pubspec.yaml")
          lines = pubspec.read_text().splitlines()
          marked = [line for line in lines if "# [FOSS_REMOVE]" in line]
          if not marked:
              raise SystemExit("ERROR: No # [FOSS_REMOVE] dependency found.")

          pubspec.write_text(
              "\n".join(line for line in lines if "# [FOSS_REMOVE]" not in line) + "\n"
          )

          for path in [
              Path("app/lib/config/init.dart"),
              Path("app/lib/pages/donation/donation_page.dart"),
              Path("app/lib/pages/donation/donation_page_vm.dart"),
          ]:
              text = path.read_text()
              if "// [FOSS_REMOVE_START]" not in text or "// [FOSS_REMOVE_END]" not in text:
                  raise SystemExit(f"ERROR: FOSS block markers missing in {path}")
              path.write_text(
                  text.replace("// [FOSS_REMOVE_START]", "/*")
                      .replace("// [FOSS_REMOVE_END]", "*/")
              )

          provider = Path("app/lib/provider/purchase_provider.dart")
          if not provider.exists():
              raise SystemExit("ERROR: purchase_provider.dart missing.")
          provider.unlink()

          donation = Path("app/lib/pages/donation/donation_page.dart")
          donation.write_text(
              donation.read_text().replace(
                  "donationPageVmProvider",
                  "donationPageNoopVmProvider",
              )
          )

          if "in_app_purchase:" in pubspec.read_text():
              raise SystemExit("ERROR: in_app_purchase remains in pubspec.yaml.")
          PY

          rm -f app/macos/Podfile.lock

      - name: Flutter clean
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter clean

      - name: Select Native Assets compatibility strategy
        shell: bash
        run: |
          set -euxo pipefail

          echo "Native Assets strategy: ${NATIVE_ASSETS_STRATEGY}"

          case "${NATIVE_ASSETS_STRATEGY}" in
            native-backport)
              echo "Keeping path_provider_foundation 2.6.0 and backporting objective_c 9.5.0."
              ;;

            legacy-path-provider)
              echo "Using path_provider_foundation 2.5.1 fallback (no objective_c Native Asset)."

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/pubspec.yaml")
          text = path.read_text()

          old = "  path_provider_foundation: 2.6.0\n"
          new = "  path_provider_foundation: 2.5.1\n"

          if old not in text:
              raise SystemExit(
                  "ERROR: Expected direct path_provider_foundation 2.6.0 dependency not found."
              )

          path.write_text(text.replace(old, new, 1))
          print("path_provider_foundation pinned to 2.5.1 fallback.")
          PY
              ;;

            *)
              echo "ERROR: Unknown NATIVE_ASSETS_STRATEGY=${NATIVE_ASSETS_STRATEGY}"
              exit 1
              ;;
          esac

      - name: Flutter pub get
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      # ============================================================
      # objective_c 9.5.0 Native Asset
      #
      # Flutter 3.41.9 can only pass an integer macOS targetVersion
      # to Native Assets and currently hardcodes 13. objective_c's
      # hook turns that into -mmacos-version-min=13.
      #
      # Patch the package hook itself so clang and ld really target
      # macOS 10.13. This is not a Mach-O metadata edit.
      # ============================================================

      - name: Backport objective_c Native Asset for High Sierra
        if: env.NATIVE_ASSETS_STRATEGY == 'native-backport'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostics

          # Do not resolve objective_c through .dart_tool/package_config.json here.
          # The package is a Dart Native Asset dependency rather than a normal
          # Flutter macOS plugin, and all we need is the exact cached 9.5.0
          # package that flutter pub get has already fetched.
          #
          # Searching the Pub cache directly also avoids URI/path corruption
          # from package_config handling and gives us deterministic diagnostics.
          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"

          echo "Pub cache root: $PUB_CACHE_ROOT"
          test -d "$PUB_CACHE_ROOT"

          CANDIDATES_FILE="diagnostics/objective_c-candidates.txt"
          : > "$CANDIDATES_FILE"

          find "$PUB_CACHE_ROOT" \
            -type f \
            -path '*/objective_c-9.5.0/hook/build.dart' \
            -print \
            | sort \
            | tee "$CANDIDATES_FILE"

          if [ ! -s "$CANDIDATES_FILE" ]; then
            echo "ERROR: objective_c 9.5.0 hook/build.dart was not found in the Pub cache."
            echo "Nearby objective_c cache entries:"
            find "$PUB_CACHE_ROOT" \
              -maxdepth 5 \
              -iname '*objective_c*' \
              -print \
              | sort \
              | head -200 \
              || true
            exit 1
          fi

          # Select the candidate in Python rather than using Bash 4-only
          # helpers such as mapfile. GitHub's macOS /bin/bash is still 3.2.
          HOOK="$(
            python3 - "$CANDIDATES_FILE" <<'PY'
          import sys
          from pathlib import Path

          candidates = [
              line.strip()
              for line in Path(sys.argv[1]).read_text().splitlines()
              if line.strip()
          ]

          canonical = [
              candidate
              for candidate in candidates
              if "/hosted/pub.dev/objective_c-9.5.0/hook/build.dart" in candidate
          ]

          if len(canonical) == 1:
              print(canonical[0])
          elif len(candidates) == 1:
              print(candidates[0])
          else:
              raise SystemExit(
                  "ERROR: Multiple objective_c 9.5.0 hook candidates were found "
                  "and no unique canonical hosted/pub.dev copy could be selected:\n  "
                  + "\n  ".join(candidates)
              )
          PY
          )"

          OBJECTIVE_C_ROOT="${HOOK%/hook/build.dart}"
          PUBSPEC="$OBJECTIVE_C_ROOT/pubspec.yaml"

          echo "objective_c root: $OBJECTIVE_C_ROOT"
          echo "objective_c hook: $HOOK"

          printf '%s\n' "$OBJECTIVE_C_ROOT" \
            > diagnostics/objective_c-root.txt

          printf '%s\n' "$HOOK" \
            > diagnostics/objective_c-hook.txt

          test -d "$OBJECTIVE_C_ROOT"
          test -f "$HOOK"
          test -f "$PUBSPEC"

          VERSION="$(
            python3 - "$PUBSPEC" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          match = re.search(r"(?m)^version:\s*([^\s]+)\s*$", text)
          if not match:
              raise SystemExit("ERROR: objective_c package version not found.")
          print(match.group(1))
          PY
          )"

          echo "objective_c version: $VERSION"

          if [ "$VERSION" != "9.5.0" ]; then
            echo "ERROR: This backport is validated against objective_c 9.5.0, got $VERSION."
            exit 1
          fi

          cp "$HOOK" diagnostics/objective_c-build.dart.original

          python3 - "$HOOK" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          pattern = re.compile(
              r"(\s*assert\(codeConfig\.targetOS == OS\.macOS\);\s*)"
              r"final targetVersion = codeConfig\.macOS\.targetVersion;\s*"
              r"return '-mmacos-version-min=\$targetVersion';"
          )

          replacement = (
              r"\1"
              "// LocalSend High Sierra backport: Native Assets only expose an integer "
              "macOS targetVersion, so force the real clang deployment target here.\n"
              "  return '-mmacos-version-min=10.13';"
          )

          patched, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              raise SystemExit(
                  "ERROR: objective_c 9.5.0 minOSVersion() structure did not match expected source."
              )

          path.write_text(patched)

          final = path.read_text()
          if "return '-mmacos-version-min=10.13';" not in final:
              raise SystemExit("ERROR: objective_c High Sierra hook patch was not written.")

          if "return '-mmacos-version-min=$targetVersion';" in final:
              raise SystemExit("ERROR: original objective_c dynamic macOS min-version return remains.")

          print("objective_c hook now forces -mmacos-version-min=10.13.")
          PY

          cp "$HOOK" diagnostics/objective_c-build.dart.high-sierra

          # Ensure hooks_runner cannot reuse a dill/cache compiled from the
          # unmodified package hook. flutter clean does not necessarily own
          # this whole cache hierarchy.
          rm -rf app/.dart_tool/hooks_runner

          echo "============================================================"
          echo "Patched objective_c minOSVersion()"
          echo "============================================================"
          grep -n -A12 -B3 "String minOSVersion" "$HOOK"

      - name: Verify Native Assets dependency strategy
        shell: bash
        run: |
          set -euxo pipefail

          cd app
          flutter pub deps --style=compact > ../native-assets-pub-deps.txt
          cd ..

          if [ "$NATIVE_ASSETS_STRATEGY" = "native-backport" ]; then
            grep -E 'objective_c[[:space:]]+9\.5\.0' native-assets-pub-deps.txt
            grep -E 'path_provider_foundation[[:space:]]+2\.6\.0' native-assets-pub-deps.txt
          else
            grep -E 'path_provider_foundation[[:space:]]+2\.5\.1' native-assets-pub-deps.txt

            if grep -E '(^|[[:space:]])objective_c([[:space:]]|$)' native-assets-pub-deps.txt; then
              echo "ERROR: objective_c is still present under legacy-path-provider fallback."
              exit 1
            fi
          fi

      - name: Verify StoreKit removal
        shell: bash
        run: |
          set -euxo pipefail
          cd app
          flutter pub deps --style=compact > ../flutter-pub-deps.txt
          cd ..

          if grep -E '(^|[[:space:]])in_app_purchase(_storekit)?([[:space:]]|$)' flutter-pub-deps.txt; then
            echo "ERROR: in_app_purchase remains in dependency graph."
            exit 1
          fi

          if grep -q 'in_app_purchase_storekit' app/.flutter-plugins-dependencies; then
            echo "ERROR: in_app_purchase_storekit remains in Flutter plugin graph."
            exit 1
          fi

      - name: Backport macOS Flutter plugin podspecs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostics
          cp app/.flutter-plugins-dependencies diagnostics/flutter-plugins-dependencies.json

          python3 <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          plugins_file = Path("app/.flutter-plugins-dependencies")
          data = json.loads(plugins_file.read_text())
          plugins = data.get("plugins", {}).get("macos", [])
          report = []

          for plugin in plugins:
              name = plugin.get("name")
              raw_path = plugin.get("path")
              if not name or not raw_path or not plugin.get("native_build", True):
                  continue

              platform_dir = "darwin" if plugin.get("shared_darwin_source", False) else "macos"
              podspec = Path(raw_path) / platform_dir / f"{name}.podspec"

              if not podspec.exists():
                  report.append({"plugin": name, "status": "no podspec"})
                  continue

              original = podspec.read_text()
              text = original
              text = re.sub(
                  r"([A-Za-z_][A-Za-z0-9_]*\.osx\.deployment_target\s*=\s*)(['\"])[0-9.]+\2",
                  r"\1'10.13'",
                  text,
              )
              text = re.sub(
                  r"([A-Za-z_][A-Za-z0-9_]*\.platform\s*=\s*:osx\s*,\s*)(['\"])[0-9.]+\2",
                  r"\1'10.13'",
                  text,
              )

              if text != original:
                  backup = podspec.with_suffix(podspec.suffix + ".high-sierra-original")
                  if not backup.exists():
                      shutil.copy2(podspec, backup)
                  podspec.write_text(text)
                  status = "patched"
              else:
                  status = "unchanged"

              report.append({"plugin": name, "podspec": str(podspec), "status": status})
              print(f"{name}: {status}: {podspec}")

          Path("diagnostics/plugin-podspec-backport-report.json").write_text(
              json.dumps(report, indent=2) + "\n"
          )
          PY

      - name: Backport gal for High Sierra
        shell: bash
        run: |
          set -euxo pipefail
          PUB_CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"
          GAL_SWIFT="$(find "$PUB_CACHE_ROOT" -type f -path '*/gal-2.3.3/darwin/gal/Sources/gal/GalPlugin.swift' -print -quit)"
          if [ -z "$GAL_SWIFT" ]; then
            echo "ERROR: GalPlugin.swift not found."
            exit 1
          fi

          cp "$GAL_SWIFT" "${GAL_SWIFT}.original"

          cat > "$GAL_SWIFT" <<'SWIFT'
          import Cocoa
          import FlutterMacOS

          public class GalPlugin: NSObject, FlutterPlugin {
            public static func register(with registrar: FlutterPluginRegistrar) {
              let channel = FlutterMethodChannel(
                name: "gal",
                binaryMessenger: registrar.messenger
              )
              registrar.addMethodCallDelegate(GalPlugin(), channel: channel)
            }

            public func handle(
              _ call: FlutterMethodCall,
              result: @escaping FlutterResult
            ) {
              switch call.method {
              case "hasAccess", "requestAccess":
                result(false)
              case "putVideo", "putImage", "putImageBytes":
                result(
                  FlutterError(
                    code: "ACCESS_DENIED",
                    message: "Direct Photos-library saving is unavailable in the macOS High Sierra build.",
                    details: nil
                  )
                )
              case "open":
                if let url = URL(string: "photos://") {
                  _ = NSWorkspace.shared.open(url)
                }
                result(nil)
              default:
                result(FlutterMethodNotImplemented)
              }
            }
          }
          SWIFT

          if grep -E '^[[:space:]]*import[[:space:]]+Photos([[:space:]]|$)' "$GAL_SWIFT"; then
            echo "ERROR: Photos import remains in GalPlugin.swift."
            exit 1
          fi

      - name: Backport connectivity_plus for High Sierra
        shell: bash
        run: |
          set -euxo pipefail

          CONNECTIVITY_ROOT="$(
            python3 <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("app/.flutter-plugins-dependencies").read_text())
          for plugin in data.get("plugins", {}).get("macos", []):
              if plugin.get("name") == "connectivity_plus":
                  print(plugin["path"])
                  break
          PY
          )"

          if [ -z "$CONNECTIVITY_ROOT" ]; then
            echo "ERROR: connectivity_plus missing from plugin graph."
            exit 1
          fi

          SOURCE="$CONNECTIVITY_ROOT/macos/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift"
          PODSPEC="$CONNECTIVITY_ROOT/macos/connectivity_plus.podspec"
          test -f "$SOURCE"
          test -f "$PODSPEC"
          cp "$SOURCE" "${SOURCE}.high-sierra-original"
          cp "$PODSPEC" "${PODSPEC}.high-sierra-specific-original"

          cat > "$SOURCE" <<'SWIFT'
          import Foundation
          import SystemConfiguration
          import CoreWLAN
          import Darwin

          public class PathMonitorConnectivityProvider: NSObject, ConnectivityProvider {
            private let queue = DispatchQueue(
              label: "dev.fluttercommunity.plus.connectivity.high-sierra"
            )
            private var timer: DispatchSourceTimer?
            private var lastSignature = ""
            public var connectivityUpdateHandler: ConnectivityUpdateHandler?

            override init() {
              super.init()
              lastSignature = signature(for: detectConnectivityTypes())
            }

            deinit {
              stop()
            }

            public var currentConnectivityTypes: [ConnectivityType] {
              return detectConnectivityTypes()
            }

            public func start() {
              if timer != nil { return }
              let source = DispatchSource.makeTimerSource(queue: queue)
              source.schedule(
                deadline: .now(),
                repeating: .seconds(2),
                leeway: .milliseconds(250)
              )
              source.setEventHandler { [weak self] in
                guard let self = self else { return }
                let current = self.detectConnectivityTypes()
                let currentSignature = self.signature(for: current)
                if currentSignature != self.lastSignature {
                  self.lastSignature = currentSignature
                  self.connectivityUpdateHandler?(current)
                }
              }
              timer = source
              source.resume()
            }

            public func stop() {
              guard let source = timer else { return }
              source.setEventHandler {}
              source.cancel()
              timer = nil
            }

            private func detectConnectivityTypes() -> [ConnectivityType] {
              guard isReachable() else { return [.none] }
              let active = activeInterfaceNames()
              if active.isEmpty { return [.other] }
              let wifi = wifiInterfaceNames()
              var result: [ConnectivityType] = []

              if active.contains(where: { wifi.contains($0) }) {
                result.append(.wifi)
              }

              let ethernet = active.contains { interfaceName in
                interfaceName.hasPrefix("en") && !wifi.contains(interfaceName)
              }
              if ethernet { result.append(.wiredEthernet) }
              if result.isEmpty { result.append(.other) }
              return result
            }

            private func isReachable() -> Bool {
              var address = sockaddr_in()
              address.sin_len = UInt8(MemoryLayout<sockaddr_in>.size)
              address.sin_family = sa_family_t(AF_INET)

              let reachability: SCNetworkReachability? = withUnsafePointer(to: &address) { pointer in
                pointer.withMemoryRebound(to: sockaddr.self, capacity: 1) { sockaddrPointer in
                  SCNetworkReachabilityCreateWithAddress(nil, sockaddrPointer)
                }
              }

              guard let target = reachability else { return false }
              var flags = SCNetworkReachabilityFlags()
              guard SCNetworkReachabilityGetFlags(target, &flags) else { return false }

              return flags.contains(.reachable)
                && !flags.contains(.connectionRequired)
                && !flags.contains(.interventionRequired)
            }

            private func activeInterfaceNames() -> Set<String> {
              var first: UnsafeMutablePointer<ifaddrs>?
              guard getifaddrs(&first) == 0, let start = first else { return [] }
              defer { freeifaddrs(start) }

              var result = Set<String>()
              var current: UnsafeMutablePointer<ifaddrs>? = start

              while let pointer = current {
                let interface = pointer.pointee
                if let socket = interface.ifa_addr {
                  let family = Int32(socket.pointee.sa_family)
                  let flags = interface.ifa_flags
                  let up = (flags & UInt32(IFF_UP)) != 0
                  let running = (flags & UInt32(IFF_RUNNING)) != 0
                  let loopback = (flags & UInt32(IFF_LOOPBACK)) != 0

                  if (family == AF_INET || family == AF_INET6)
                    && up && running && !loopback
                  {
                    let name = String(cString: interface.ifa_name)
                    if !name.hasPrefix("awdl") && !name.hasPrefix("llw") {
                      result.insert(name)
                    }
                  }
                }
                current = interface.ifa_next
              }

              return result
            }

            private func wifiInterfaceNames() -> Set<String> {
              guard let interfaces = CWWiFiClient.shared().interfaces() else { return [] }
              return Set(interfaces.compactMap { $0.interfaceName })
            }

            private func signature(for types: [ConnectivityType]) -> String {
              return types.map { type in
                switch type {
                case .none: return "none"
                case .wiredEthernet: return "ethernet"
                case .wifi: return "wifi"
                case .cellular: return "cellular"
                case .satellite: return "satellite"
                case .other: return "other"
                }
              }
              .sorted()
              .joined(separator: ",")
            }
          }
          SWIFT

          python3 - "$PODSPEC" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "SystemConfiguration" not in text or "CoreWLAN" not in text:
              framework_line = "  s.frameworks = 'SystemConfiguration', 'CoreWLAN'\n"
              marker = "  s.swift_version = '5.0'\n"
              if marker in text:
                  text = text.replace(marker, framework_line + marker, 1)
              else:
                  index = text.rfind("\nend")
                  if index == -1:
                      raise SystemExit("ERROR: Could not patch connectivity_plus podspec.")
                  text = text[:index] + "\n" + framework_line + text[index:]

          path.write_text(text)
          PY

          python3 - "$SOURCE" <<'PY'
          import re
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()
          source = re.sub(r"/\*.*?\*/", "", source, flags=re.DOTALL)
          source = re.sub(r"//[^\n]*", "", source)

          for pattern in [
              r"(?m)^\s*import\s+Network\s*$",
              r"\bNWPathMonitor\b",
              r"\bNWPath\b",
              r"\bNWInterface\b",
          ]:
              if re.search(pattern, source):
                  raise SystemExit("ERROR: Network.framework API remains in connectivity_plus.")

          print("PASS: connectivity_plus High Sierra shim validated.")
          PY

      - name: Prepare Cargokit
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        shell: bash
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Verify Rust workspace
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostics
          cargo metadata --format-version=1 --no-deps > diagnostics/cargo-metadata.json

      # The project-level Release.xcconfig includes Flutter-Release.xcconfig,
      # which includes Pods-Runner.release.xcconfig. ShareExtension therefore
      # needs target-level empty overrides so it cannot inherit Runner Pods.
      - name: Patch LocalSend Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          RELEASE_XCCONFIG="app/macos/Runner/Configs/Release.xcconfig"

          python3 - "$PBX" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # --------------------------------------------------------
          # Deployment / Intel / High Sierra settings
          # --------------------------------------------------------
          text, count = re.subn(
              r'MACOSX_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;',
              'MACOSX_DEPLOYMENT_TARGET = "$(LOCALSEND_LEGACY_MACOS_TARGET)";',
              text,
          )
          if count == 0:
              raise SystemExit("ERROR: No Xcode deployment targets found.")

          text = re.sub(
              r'ENABLE_HARDENED_RUNTIME\s*=\s*YES;',
              'ENABLE_HARDENED_RUNTIME = NO;',
              text,
          )

          global_settings = (
              "buildSettings = {\n"
              "\t\t\t\tLOCALSEND_LEGACY_MACOS_TARGET = 10.13;\n"
              "\t\t\t\tARCHS = x86_64;\n"
              "\t\t\t\tEXCLUDED_ARCHS = arm64;\n"
              "\t\t\t\tONLY_ACTIVE_ARCH = NO;\n"
              "\t\t\t\tENABLE_HARDENED_RUNTIME = NO;\n"
          )
          text = text.replace("buildSettings = {\n", global_settings)
          text = re.sub(
              r'ONLY_ACTIVE_ARCH\s*=\s*(?:YES|NO);',
              'ONLY_ACTIVE_ARCH = NO;',
              text,
          )

          # --------------------------------------------------------
          # Ad-hoc signing
          # --------------------------------------------------------
          text = re.sub(
              r'DEVELOPMENT_TEAM\s*=\s*[A-Z0-9]+;',
              'DEVELOPMENT_TEAM = "";',
              text,
          )
          text = re.sub(
              r'CODE_SIGN_STYLE\s*=\s*Automatic;',
              'CODE_SIGN_STYLE = Manual;',
              text,
          )
          text = re.sub(
              r'CODE_SIGN_IDENTITY\s*=\s*"(?:Apple Development|Mac Development|Mac Developer)";',
              'CODE_SIGN_IDENTITY = "-";',
              text,
          )
          text = re.sub(
              r'("CODE_SIGN_IDENTITY\[sdk=macosx\*\]"\s*=\s*)"(?:Apple Development|Mac Development|Mac Developer)";',
              r'\1"-";',
              text,
          )
          text = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*"[^"]*";',
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              text,
          )

          # --------------------------------------------------------
          # Find ShareExtension's target configuration list.
          # --------------------------------------------------------
          target_match = re.search(
              r'[0-9A-F]+\s*/\*\s*ShareExtension\s*\*/\s*=\s*\{'
              r'.*?buildConfigurationList\s*=\s*([0-9A-F]+)\s*/\*\s*'
              r'Build configuration list for PBXNativeTarget "ShareExtension"\s*\*/;',
              text,
              flags=re.DOTALL,
          )
          if not target_match:
              raise SystemExit("ERROR: ShareExtension target configuration list not found.")

          config_list_id = target_match.group(1)
          config_list_match = re.search(
              re.escape(config_list_id)
              + r'\s*/\*\s*Build configuration list for PBXNativeTarget "ShareExtension"\s*\*/'
              + r'\s*=\s*\{.*?buildConfigurations\s*=\s*\((.*?)\);.*?\};',
              text,
              flags=re.DOTALL,
          )
          if not config_list_match:
              raise SystemExit("ERROR: ShareExtension configuration list body not found.")

          config_pairs = re.findall(
              r'([0-9A-F]+)\s*/\*\s*(Debug|Release|Profile)\s*\*/',
              config_list_match.group(1),
          )
          if len(config_pairs) != 3:
              raise SystemExit(
                  f"ERROR: Expected Debug/Release/Profile ShareExtension configs; got {config_pairs!r}."
              )

          isolation_settings = [
              'OTHER_LDFLAGS = "";',
              'FRAMEWORK_SEARCH_PATHS = "";',
              'HEADER_SEARCH_PATHS = "";',
              'OTHER_SWIFT_FLAGS = "";',
              'GCC_PREPROCESSOR_DEFINITIONS = "";',
              'PODS_ROOT = "";',
              'PODS_PODFILE_DIR_PATH = "";',
          ]

          # --------------------------------------------------------
          # Inject target-level settings into each ShareExtension
          # XCBuildConfiguration. These override project-level
          # Pods-Runner settings. Do NOT use $(inherited).
          # --------------------------------------------------------
          for config_id, config_name in config_pairs:
              pattern = re.compile(
                  r'('
                  + re.escape(config_id)
                  + r'\s*/\*\s*'
                  + re.escape(config_name)
                  + r'\s*\*/\s*=\s*\{\s*isa\s*=\s*XCBuildConfiguration;'
                  + r'\s*buildSettings\s*=\s*\{\n)'
                  + r'(.*?)'
                  + r'(\n\s*\};.*?\n\s*name\s*=\s*'
                  + re.escape(config_name)
                  + r';\s*\n\s*\};)',
                  flags=re.DOTALL,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(
                      f"ERROR: ShareExtension {config_name} buildSettings block not found."
                  )

              body = match.group(2)
              keys = [
                  "OTHER_LDFLAGS",
                  "FRAMEWORK_SEARCH_PATHS",
                  "HEADER_SEARCH_PATHS",
                  "OTHER_SWIFT_FLAGS",
                  "GCC_PREPROCESSOR_DEFINITIONS",
                  "PODS_ROOT",
                  "PODS_PODFILE_DIR_PATH",
              ]

              for key in keys:
                  body = re.sub(
                      r'^\s*' + re.escape(key) + r'\s*=\s*.*?;\s*$\n?',
                      '',
                      body,
                      flags=re.MULTILINE,
                  )
                  body = re.sub(
                      r'^\s*' + re.escape(key) + r'\s*=\s*\(.*?^\s*\);\s*$\n?',
                      '',
                      body,
                      flags=re.MULTILINE | re.DOTALL,
                  )

              injected = "".join(
                  "\t\t\t\t" + setting + "\n"
                  for setting in isolation_settings
              ) + body

              text = (
                  text[:match.start()]
                  + match.group(1)
                  + injected
                  + match.group(3)
                  + text[match.end():]
              )

          # --------------------------------------------------------
          # Remove Runner/Shared.swift from ShareExtension Sources.
          # --------------------------------------------------------
          source_blocks = list(re.finditer(
              r'([0-9A-F]+\s*/\*\s*Sources\s*\*/\s*=\s*\{.*?files\s*=\s*\()'
              r'(.*?)'
              r'(\);.*?\};)',
              text,
              flags=re.DOTALL,
          ))

          share_source = None
          for match in source_blocks:
              if "ShareController.swift in Sources" in match.group(2):
                  share_source = match
                  break

          if share_source is None:
              raise SystemExit("ERROR: ShareExtension Sources phase not found.")

          body = share_source.group(2)
          body, removed = re.subn(
              r'^.*Shared\.swift in Sources.*$\n?',
              '',
              body,
              count=1,
              flags=re.MULTILINE,
          )
          if removed != 1:
              raise SystemExit("ERROR: Could not remove Shared.swift from ShareExtension.")

          text = (
              text[:share_source.start()]
              + share_source.group(1)
              + body
              + share_source.group(3)
              + text[share_source.end():]
          )

          # --------------------------------------------------------
          # DockProgress -> exact 3.2.0
          # --------------------------------------------------------
          dock = re.compile(
              r'('
              r'[0-9A-F]+\s*/\*\s*XCRemoteSwiftPackageReference "DockProgress"\s*\*/'
              r'\s*=\s*\{.*?repositoryURL\s*=\s*'
              r'"https://github\.com/sindresorhus/DockProgress";'
              r'\s*requirement\s*=\s*\{'
              r')'
              r'.*?'
              r'(\};\s*\};)',
              re.DOTALL,
          )
          match = dock.search(text)
          if not match:
              raise SystemExit("ERROR: DockProgress package block not found.")

          replacement = (
              match.group(1)
              + "\n\t\t\t\tkind = exactVersion;\n"
              + "\t\t\t\tversion = 3.2.0;\n\t\t\t"
              + match.group(2)
          )
          text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text)

          # --------------------------------------------------------
          # CORRECTED validation.
          #
          # Previous workflow did:
          #   start = final.find(config_id)
          #   next_config = final.find("isa = XCBuildConfiguration;")
          #
          # The first `isa` found was the CURRENT config's own isa,
          # so the validation section was truncated before
          # buildSettings and falsely failed.
          #
          # Match the complete XCBuildConfiguration instead.
          # --------------------------------------------------------
          final = path.read_text()

          for config_id, config_name in config_pairs:
              validation = re.compile(
                  re.escape(config_id)
                  + r'\s*/\*\s*'
                  + re.escape(config_name)
                  + r'\s*\*/\s*=\s*\{'
                  + r'.*?isa\s*=\s*XCBuildConfiguration;'
                  + r'.*?buildSettings\s*=\s*\{'
                  + r'(.*?)'
                  + r'\n\s*\};'
                  + r'.*?\n\s*name\s*=\s*'
                  + re.escape(config_name)
                  + r';\s*\n\s*\};',
                  flags=re.DOTALL,
              )

              match = validation.search(final)
              if not match:
                  raise SystemExit(
                      f"ERROR: Could not re-read ShareExtension {config_name} "
                      "XCBuildConfiguration after patch."
                  )

              build_settings = match.group(1)
              missing = [
                  setting
                  for setting in isolation_settings
                  if setting not in build_settings
              ]
              if missing:
                  raise SystemExit(
                      f"ERROR: ShareExtension {config_name} isolation settings "
                      f"missing after patch: {missing!r}"
                  )

              print(
                  f"PASS: ShareExtension {config_name} isolation settings present."
              )

          print(
              "PASS: ShareExtension target configurations explicitly "
              "override Runner/CocoaPods linker settings."
          )
          PY

          cat >> "$RELEASE_XCCONFIG" <<'EOF'

          // ========================================================
          // LocalSend macOS High Sierra Backport
          // ========================================================
          LOCALSEND_LEGACY_MACOS_TARGET = 10.13
          MACOSX_DEPLOYMENT_TARGET = $(LOCALSEND_LEGACY_MACOS_TARGET)
          ARCHS = x86_64
          EXCLUDED_ARCHS = arm64
          ONLY_ACTIVE_ARCH = NO
          ENABLE_HARDENED_RUNTIME = NO
          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =
          EOF

          python3 <<'PY'
          from pathlib import Path
          path = Path("app/macos/Runner/AppDelegate.swift")
          text = path.read_text().replace(
              "@MainActor private func handleFlutterCall",
              "private func handleFlutterCall",
          )
          path.write_text(text)
          PY

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/macos/Runner/Shared.swift")
          text = path.read_text()
          pattern = re.compile(
              r'let teamIdentifierPrefix\s*=\s*'
              r'Bundle\.main\.infoDictionary!\["AppIdentifierPrefix"\]\s*as!\s*String'
              r'\s*\n'
              r'let sharedDefaults\s*=\s*'
              r'UserDefaults\(suiteName:\s*"\\\(teamIdentifierPrefix\)localsend\.shared_group"\)!'
          )
          replacement = r'''let teamIdentifierPrefix =
              (
                  Bundle.main.infoDictionary?[
                      "AppIdentifierPrefix"
                  ] as? String
              )
              ?? ""

          let sharedDefaultsSuiteName =
              teamIdentifierPrefix
              + "localsend.shared_group"

          let sharedDefaults =
              UserDefaults(
                  suiteName:
                      sharedDefaultsSuiteName
              )
              ?? UserDefaults(
                  suiteName:
                      "localsend.shared_group"
              )
              ?? .standard'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("ERROR: Could not patch Runner/Shared.swift UserDefaults setup.")
          path.write_text(text)
          PY

          rm -f \
            app/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            app/macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Patch Podfile
        shell: bash
        run: |
          set -euxo pipefail
          PODFILE="app/macos/Podfile"

          python3 - "$PODFILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          text = re.sub(
              r"\ntarget\s+['\"]ShareExtension['\"]\s+do.*?\nend\s*\n",
              "\n",
              text,
              flags=re.DOTALL,
          )

          text, count = re.subn(
              r"^platform\s+:osx,\s*['\"][0-9.]+['\"]",
              "legacy_macos_target = '10.13'\nplatform :osx, legacy_macos_target",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("ERROR: Podfile platform patch failed.")

          text, count = re.subn(
              r"config\.build_settings\[['\"]MACOSX_DEPLOYMENT_TARGET['\"]\]\s*=\s*['\"][0-9.]+['\"]",
              "config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = legacy_macos_target",
              text,
          )
          if count == 0:
              raise SystemExit("ERROR: Pod deployment target patch failed.")

          needle = "config.build_settings['MACOSX_DEPLOYMENT_TARGET'] = legacy_macos_target"
          if "config.build_settings['ARCHS'] = 'x86_64'" not in text:
              text = text.replace(
                  needle,
                  needle
                  + "\n      config.build_settings['ARCHS'] = 'x86_64'"
                  + "\n      config.build_settings['EXCLUDED_ARCHS'] = 'arm64'"
                  + "\n      config.build_settings['ONLY_ACTIVE_ARCH'] = 'NO'",
                  1,
              )

          text = text.replace(
              "config.build_settings['ONLY_ACTIVE_ARCH'] = 'YES'",
              "config.build_settings['ONLY_ACTIVE_ARCH'] = 'NO'",
          )

          path.write_text(text)
          PY

          ruby -c "$PODFILE"
          cat "$PODFILE"

          if grep -q -E "target ['\"]ShareExtension['\"]" "$PODFILE"; then
            echo "ERROR: ShareExtension must not be a CocoaPods target."
            exit 1
          fi

      - name: Backport ShareExtension for High Sierra
        shell: bash
        run: |
          set -euxo pipefail
          UTILITIES="app/macos/ShareExtension/Utilities.swift"
          CONTROLLER="app/macos/ShareExtension/ShareController.swift"

          cp "$UTILITIES" "${UTILITIES}.high-sierra-original"
          cp "$CONTROLLER" "${CONTROLLER}.high-sierra-original"

          cat > "$UTILITIES" <<'SWIFT'
          import AppKit
          import Foundation

          extension Sequence where Element: Sequence {
            func flatten() -> [Element.Element] {
              return flatMap { $0 }
            }
          }

          struct TextContent {
            var title: String?
            var body: String?
          }

          let pendingFilesKey = "pendingFiles"
          let pendingStringsKey = "pendingStrings"

          let extensionSharedDefaults: UserDefaults = {
            let prefix = (
              Bundle.main.infoDictionary?["AppIdentifierPrefix"] as? String
            ) ?? ""
            let preferredName = prefix + "localsend.shared_group"
            if let defaults = UserDefaults(suiteName: preferredName) {
              return defaults
            }
            if let defaults = UserDefaults(suiteName: "localsend.shared_group") {
              return defaults
            }
            return .standard
          }()

          extension NSExtensionContext {
            var inputItemsTyped: [NSExtensionItem] {
              return inputItems as? [NSExtensionItem] ?? []
            }

            var attachments: [NSItemProvider] {
              return inputItemsTyped.compactMap { $0.attachments }.flatten()
            }

            var textContent: TextContent {
              return TextContent(
                title: inputItemsTyped.first?.attributedTitle?.string,
                body: inputItemsTyped.first?.attributedContentText?.string
              )
            }
          }

          extension NSError {
            static let userCancelled = NSError(
              domain: NSCocoaErrorDomain,
              code: NSUserCancelledError,
              userInfo: nil
            )
          }

          typealias ExtensionRunCompletion = ([NSExtensionItem], Error?) -> Void

          func createBookmarkForSharedFile(at url: URL) -> Data? {
            do {
              return try (url as NSURL).bookmarkData(
                options: .minimalBookmark,
                includingResourceValuesForKeys: nil,
                relativeTo: nil
              )
            } catch {
              print("Failed to create bookmark: " + error.localizedDescription)
              return nil
            }
          }

          class ExtensionController: NSViewController {
            override func loadView() {
              view = NSView(frame: .zero)
              guard let context = extensionContext else { return }
              run(context) { items, error in
                DispatchQueue.main.async {
                  if let error = error {
                    context.cancelRequest(withError: error)
                    return
                  }
                  context.completeRequest(
                    returningItems: items,
                    completionHandler: nil
                  )
                }
              }
            }

            func run(
              _ context: NSExtensionContext,
              completion: @escaping ExtensionRunCompletion
            ) {
              completion([], nil)
            }
          }

          private func isAppRunning(at url: URL) -> Bool {
            return NSWorkspace.shared.runningApplications.contains {
              $0.bundleURL == url
            }
          }

          func launchAppIfNeeded(appURL: URL) {
            guard !isAppRunning(at: appURL) else { return }
            _ = NSWorkspace.shared.open(appURL)
          }

          func getParentAppURL() -> URL {
            return Bundle.main.bundleURL
              .deletingLastPathComponent()
              .deletingLastPathComponent()
              .deletingLastPathComponent()
          }
          SWIFT

          cat > "$CONTROLLER" <<'SWIFT'
          import Foundation

          final class ShareController: ExtensionController {
            private let urlTypeIdentifier = "public.url"

            override func run(
              _ context: NSExtensionContext,
              completion: @escaping ExtensionRunCompletion
            ) {
              let group = DispatchGroup()
              let lock = NSLock()
              var urls: [URL] = []
              var sharedString: String?

              for provider in context.attachments {
                guard provider.hasItemConformingToTypeIdentifier(urlTypeIdentifier) else {
                  continue
                }

                group.enter()
                provider.loadItem(
                  forTypeIdentifier: urlTypeIdentifier,
                  options: nil
                ) { item, error in
                  defer { group.leave() }

                  if let error = error {
                    print("Failed to load URL: " + error.localizedDescription)
                    return
                  }

                  guard let url = self.url(from: item) else { return }

                  lock.lock()
                  if url.isFileURL {
                    urls.append(url)
                  } else {
                    sharedString = url.absoluteString
                  }
                  lock.unlock()
                }
              }

              group.notify(queue: .main) {
                lock.lock()
                let collectedURLs = urls
                var collectedString = sharedString
                lock.unlock()

                if let body = context.textContent.body {
                  collectedString = body
                }

                if collectedURLs.isEmpty && collectedString == nil {
                  completion([], NSError.userCancelled)
                  return
                }

                var pendingFiles = extensionSharedDefaults.array(
                  forKey: pendingFilesKey
                ) as? [Data] ?? []

                pendingFiles.append(
                  contentsOf: collectedURLs.compactMap {
                    createBookmarkForSharedFile(at: $0)
                  }
                )

                extensionSharedDefaults.set(
                  pendingFiles,
                  forKey: pendingFilesKey
                )

                if let string = collectedString {
                  var pendingStrings = extensionSharedDefaults.stringArray(
                    forKey: pendingStringsKey
                  ) ?? []
                  pendingStrings.append(string)
                  extensionSharedDefaults.set(
                    pendingStrings,
                    forKey: pendingStringsKey
                  )
                }

                _ = extensionSharedDefaults.synchronize()
                launchAppIfNeeded(appURL: getParentAppURL())
                completion([], nil)
              }
            }

            private func url(from item: Any?) -> URL? {
              if let value = item as? URL { return value }
              if let value = item as? NSURL { return value as URL }
              if let value = item as? String {
                if let parsed = URL(string: value), parsed.scheme != nil {
                  return parsed
                }
                return URL(fileURLWithPath: value)
              }
              if let value = item as? NSString {
                return url(from: value as String)
              }
              return nil
            }
          }
          SWIFT

          python3 - "$UTILITIES" "$CONTROLLER" <<'PY'
          import re
          import sys
          from pathlib import Path

          code = "\n".join(Path(path).read_text() for path in sys.argv[1:])
          forbidden = {
              "Defaults": r"(?m)^\s*import\s+Defaults\s*$",
              "Flutter": r"(?m)^\s*import\s+Flutter",
              "SwiftUI": r"(?m)^\s*import\s+SwiftUI\s*$",
              "UniformTypeIdentifiers": r"(?m)^\s*import\s+UniformTypeIdentifiers\s*$",
              "UTType": r"\bUTType\b",
              "Task": r"\bTask\b",
              "await": r"\bawait\b",
              "async function": r"\)\s*async(?:\s+throws)?\b",
          }

          for name, pattern in forbidden.items():
              if re.search(pattern, code):
                  raise SystemExit(f"ERROR: {name} remains in ShareExtension.")

          print("PASS: ShareExtension source is Foundation/AppKit-only.")
          PY

      - name: Validate High Sierra source patch
        shell: bash
        run: |
          set -euxo pipefail
          PBX="app/macos/Runner.xcodeproj/project.pbxproj"
          PODFILE="app/macos/Podfile"

          if grep -q "3W7H4PYMCV" "$PBX"; then
            echo "ERROR: Upstream Team ID remains."
            exit 1
          fi

          if grep -q "platform :osx, '10.13'" "$PODFILE"; then
            echo "ERROR: Literal 10.13 Podfile target would trigger Flutter migration."
            exit 1
          fi

          if grep -q -E "target ['\"]ShareExtension['\"]" "$PODFILE"; then
            echo "ERROR: ShareExtension must not use CocoaPods."
            exit 1
          fi

          if grep -q 'ENABLE_HARDENED_RUNTIME = YES;' "$PBX"; then
            echo "ERROR: Hardened Runtime is still enabled."
            exit 1
          fi

          ruby -c "$PODFILE"

      - name: Generate Flutter macOS configuration - first pass
        id: flutter_config_first
        continue-on-error: true
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter build macos --release --config-only -v \
            2>&1 | tee ../flutter-config-first.log

      - name: Install CocoaPods dependencies
        working-directory: app/macos
        shell: bash
        run: |
          set -euxo pipefail
          test -f Flutter/ephemeral/Flutter-Generated.xcconfig
          pod env 2>&1 | tee ../../pod-env.log
          rm -rf Pods
          rm -f Podfile.lock

          set +e
          pod install --verbose 2>&1 | tee ../../pod-install.log
          STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "$STATUS" -ne 0 ]; then
            grep -n -A20 -B10 -E '^\[!\]|ERROR|Error|higher minimum deployment target|could not find compatible versions' \
              ../../pod-install.log | tail -n 400 || true
            exit "$STATUS"
          fi

          test -f Flutter/ephemeral/FlutterMacOS.podspec

          if ! grep -q "s.osx.deployment_target = '10.13'" Flutter/ephemeral/FlutterMacOS.podspec; then
            echo "ERROR: Generated FlutterMacOS.podspec is not 10.13."
            cat Flutter/ephemeral/FlutterMacOS.podspec
            exit 1
          fi

          if [ -d "Pods/Target Support Files/Pods-ShareExtension" ]; then
            echo "ERROR: CocoaPods unexpectedly integrated ShareExtension."
            exit 1
          fi

      - name: Finalize Flutter macOS configuration
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          flutter build macos --release --config-only -v \
            2>&1 | tee ../flutter-config-final.log

      - name: Resolve Swift packages
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/macos/SourcePackages
          xcodebuild \
            -resolvePackageDependencies \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -clonedSourcePackagesDirPath build/macos/SourcePackages \
            2>&1 | tee ../swiftpm-resolve.log

      - name: Verify effective Xcode settings and ShareExtension isolation
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../diagnostics

          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            BUILD_DIR="$PWD/build/macos" \
            > ../diagnostics/runner-build-settings.txt

          xcodebuild \
            -project macos/Runner.xcodeproj \
            -target ShareExtension \
            -configuration Release \
            -showBuildSettings \
            BUILD_DIR="$PWD/build/macos" \
            > ../diagnostics/shareextension-build-settings.txt

          echo "============================================================"
          echo "Runner"
          echo "============================================================"
          grep -E 'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|ENABLE_HARDENED_RUNTIME|OTHER_LDFLAGS|FRAMEWORK_SEARCH_PATHS|COCOAPODS' \
            ../diagnostics/runner-build-settings.txt || true

          echo
          echo "============================================================"
          echo "ShareExtension"
          echo "============================================================"
          grep -E 'ARCHS|EXCLUDED_ARCHS|ONLY_ACTIVE_ARCH|MACOSX_DEPLOYMENT_TARGET|ENABLE_HARDENED_RUNTIME|OTHER_LDFLAGS|FRAMEWORK_SEARCH_PATHS|HEADER_SEARCH_PATHS|OTHER_SWIFT_FLAGS|GCC_PREPROCESSOR_DEFINITIONS|PODS_ROOT|COCOAPODS' \
            ../diagnostics/shareextension-build-settings.txt || true

          python3 <<'PY'
          from pathlib import Path
          import re

          runner_path = Path("../diagnostics/runner-build-settings.txt")
          share_path = Path("../diagnostics/shareextension-build-settings.txt")
          runner = runner_path.read_text()
          share = share_path.read_text()

          def value(text, name):
              match = re.search(
                  rf"(?m)^\s*{re.escape(name)}\s*=\s*(.*?)\s*$",
                  text,
              )
              return match.group(1) if match else None

          for path, text in [(runner_path, runner), (share_path, share)]:
              deployment = value(text, "MACOSX_DEPLOYMENT_TARGET")
              archs = value(text, "ARCHS")
              active = value(text, "ONLY_ACTIVE_ARCH")

              if deployment != "10.13":
                  raise SystemExit(
                      f"ERROR: {path}: MACOSX_DEPLOYMENT_TARGET={deployment!r}"
                  )
              if archs is None or "x86_64" not in archs.split():
                  raise SystemExit(f"ERROR: {path}: ARCHS={archs!r}")
              if active != "NO":
                  raise SystemExit(f"ERROR: {path}: ONLY_ACTIVE_ARCH={active!r}")

          runner_ldflags = value(runner, "OTHER_LDFLAGS") or ""
          if "connectivity_plus" not in runner_ldflags:
              raise SystemExit(
                  "ERROR: Runner CocoaPods linkage was unexpectedly removed."
              )

          share_keys = [
              "OTHER_LDFLAGS",
              "FRAMEWORK_SEARCH_PATHS",
              "HEADER_SEARCH_PATHS",
              "OTHER_SWIFT_FLAGS",
              "GCC_PREPROCESSOR_DEFINITIONS",
              "PODS_ROOT",
              "PODS_PODFILE_DIR_PATH",
          ]

          forbidden_tokens = [
              "COCOAPODS",
              "Pods-Runner",
              "Pods_Runner",
              "Defaults",
              "connectivity_plus",
              "desktop_drop",
              "device_info_plus",
              "dynamic_color",
              "file_picker",
              "file_selector_macos",
              "gal",
              "network_info_plus",
              "open_file_mac",
              "package_info_plus",
              "pasteboard",
              "photo_manager",
              "rust_lib_localsend_app",
              "screen_retriever_macos",
              "shared_preferences_foundation",
              "tray_manager",
              "uri_content",
              "url_launcher_macos",
              "video_player_avfoundation",
              "wakelock_plus",
              "window_manager",
          ]

          contamination = []
          for key in share_keys:
              current = value(share, key) or ""
              for token in forbidden_tokens:
                  if token in current:
                      contamination.append((key, token, current))

          if contamination:
              print("ERROR: ShareExtension still inherits Runner/CocoaPods build settings:")
              for key, token, current in contamination:
                  print(f"\n{key}: contains {token!r}\n{current}")
              raise SystemExit(1)

          print("PASS: Runner retains CocoaPods linkage.")
          print("PASS: ShareExtension effective settings contain no Runner/CocoaPods linkage.")
          PY

      - name: Build macOS app
        working-directory: app
        shell: bash
        env:
          ARCHS: x86_64
          EXCLUDED_ARCHS: arm64
          ONLY_ACTIVE_ARCH: "NO"
        run: |
          set -o pipefail
          flutter build macos --release -v \
            2>&1 | tee ../flutter-macos-build.log

      - name: Extract compiler errors
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics

          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path("flutter-macos-build.log")
          if not source.exists():
              raise SystemExit(0)

          lines = source.read_text(errors="replace").splitlines()
          pattern = re.compile(
              r"(?:\berror:|\bfatal error:|Undefined symbols for architecture|"
              r"symbol\(s\) not found|ld: |clang: error:|\*\* BUILD FAILED \*\*|"
              r"The following build commands failed:)"
          )
          hits = [i for i, line in enumerate(lines) if pattern.search(line)]
          ranges = []

          for index in hits:
              start = max(0, index - 20)
              end = min(len(lines), index + 30)
              if ranges and start <= ranges[-1][1]:
                  ranges[-1] = (ranges[-1][0], max(ranges[-1][1], end))
              else:
                  ranges.append((start, end))

          output = []
          for start, end in ranges:
              output.append("=" * 100)
              for index in range(start, end):
                  output.append(f"{index + 1}: {lines[index]}")

          Path("diagnostics/compiler-errors.txt").write_text(
              "\n".join(output) + ("\n" if output else "")
          )
          print("\n".join(output))
          PY

      - name: Locate built application
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "ERROR: LocalSend.app not found."
            exit 1
          fi

          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "APP_EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"

      - name: Capture application entitlements
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../diagnostics
          codesign \
            --display \
            --entitlements - \
            --xml \
            "$APP" \
            2>/dev/null \
          | plutil \
              -convert xml1 \
              -o ../diagnostics/LocalSend.entitlements.original.plist \
              -
          plutil -lint ../diagnostics/LocalSend.entitlements.original.plist

      # ============================================================
      # Verify objective_c Native Asset was genuinely compiled for 10.13.
      #
      # In native-backport mode the final binary must:
      #   - declare minOS <= 10.13
      #   - not import post-High-Sierra Objective-C runtime helpers
      #
      # In legacy-path-provider mode objective_c.framework must not exist.
      # ============================================================

      - name: Verify objective_c Native Asset backport
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../diagnostics

          FRAMEWORK="$APP/Contents/Frameworks/objective_c.framework"
          BINARY="$FRAMEWORK/Versions/A/objective_c"

          if [ "$NATIVE_ASSETS_STRATEGY" = "legacy-path-provider" ]; then
            if [ -e "$FRAMEWORK" ]; then
              echo "ERROR: objective_c.framework exists even though legacy fallback was selected."
              exit 1
            fi

            echo "PASS: legacy path_provider fallback contains no objective_c Native Asset."
            exit 0
          fi

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: objective_c.framework was not produced in native-backport mode."
            exit 1
          fi

          echo "============================================================"
          echo "objective_c Native Asset"
          echo "============================================================"

          file "$BINARY"
          lipo -archs "$BINARY"
          otool -l "$BINARY" | awk '
            /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
            /cmd LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++; if (count >= 10) show=0 }
          '
          otool -L "$BINARY"

          nm -u -m "$BINARY" \
            > ../diagnostics/objective_c.undefined-symbols.txt \
            2>&1 || true

          # These are compiler/runtime optimizations unavailable on High Sierra.
          # objc_alloc_init: macOS 10.14.4+
          # objc_opt_*:      macOS 10.15+
          if grep -E '_objc_alloc_init|_objc_opt_' \
            ../diagnostics/objective_c.undefined-symbols.txt; then

            echo "ERROR: objective_c still imports post-10.13 libobjc entrypoints."
            exit 1
          fi

          python3 - "$BINARY" <<'PY'
          import re
          import subprocess
          import sys

          binary = sys.argv[1]
          output = subprocess.check_output(["otool", "-l", binary], text=True)

          versions = []
          for pattern in (
              r"cmd LC_VERSION_MIN_MACOSX.*?\bversion\s+([0-9.]+)",
              r"cmd LC_BUILD_VERSION.*?\bminos\s+([0-9.]+)",
          ):
              match = re.search(pattern, output, flags=re.DOTALL)
              if match:
                  versions.append(match.group(1))

          if not versions:
              raise SystemExit("ERROR: objective_c has no macOS deployment load command.")

          def version_tuple(value):
              parts = [int(part) for part in value.split(".")]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          for version in versions:
              if version_tuple(version) > version_tuple("10.13"):
                  raise SystemExit(
                      f"ERROR: objective_c Native Asset still requires macOS {version}."
                  )

          print(f"PASS: objective_c deployment markers are High Sierra compatible: {versions}")
          PY

          grep -n -- '-mmacos-version-min=10.13' ../flutter-macos-build.log \
            > ../diagnostics/objective_c-min-version-build-log.txt \
            || true

      # ============================================================
      # FlutterMacOS 3.41.9 is precompiled for Catalina and imports two
      # libobjc helpers absent on High Sierra:
      #
      #   objc_alloc_init  (10.14.4+)
      #   objc_opt_self    (10.15+)
      #
      # Build an x86_64/10.13 compatibility umbrella dylib that:
      #   1. re-exports the real system libobjc;
      #   2. supplies semantically equivalent implementations for only
      #      those missing entrypoints.
      #
      # FlutterMacOS's existing libobjc load-command ordinal is then
      # redirected to @rpath/HSObjC.dylib. Because HSObjC re-exports
      # libobjc, all ordinary Objective-C runtime imports continue to
      # resolve through the system runtime while the two missing helpers
      # resolve locally.
      # ============================================================

      - name: Build High Sierra Objective-C runtime compatibility shim
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../diagnostics

          FRAMEWORKS="$APP/Contents/Frameworks"
          SHIM="$FRAMEWORKS/HSObjC.dylib"
          SOURCE="../diagnostics/HSObjC.m"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"

          cat > "$SOURCE" <<'OBJC'
          #include <objc/objc.h>
          #include <objc/message.h>
          #include <objc/runtime.h>

          // macOS 10.14.4 added objc_alloc_init(). The documented semantic
          // operation is exactly [[cls alloc] init], so reproduce that using
          // message dispatch available on High Sierra. This also preserves
          // custom +alloc and -init implementations.
          __attribute__((visibility("default")))
          id objc_alloc_init(Class cls) {
            if (cls == Nil) {
              return nil;
            }

            SEL allocSelector = sel_registerName("alloc");
            SEL initSelector = sel_registerName("init");

            id allocated = ((id (*)(id, SEL))objc_msgSend)((id)cls, allocSelector);
            return ((id (*)(id, SEL))objc_msgSend)(allocated, initSelector);
          }

          // objc_opt_self() is the optimized runtime equivalent of [obj self].
          // Send the actual message instead of merely returning obj so class
          // realization/registration side effects are preserved.
          __attribute__((visibility("default")))
          id objc_opt_self(id obj) {
            if (obj == nil) {
              return nil;
            }

            SEL selfSelector = sel_registerName("self");
            return ((id (*)(id, SEL))objc_msgSend)(obj, selfSelector);
          }
          OBJC

          rm -f "$SHIM"

          xcrun clang \
            -dynamiclib \
            -arch x86_64 \
            -isysroot "$SDKROOT" \
            -mmacosx-version-min=10.13 \
            -install_name '@rpath/HSObjC.dylib' \
            -Wl,-compatibility_version,1.0.0 \
            -Wl,-current_version,1.0.0 \
            -Wl,-reexport-lobjc \
            "$SOURCE" \
            -o "$SHIM"

          file "$SHIM"
          lipo -archs "$SHIM"
          otool -L "$SHIM"
          otool -l "$SHIM" | awk '
            /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
            /cmd LC_BUILD_VERSION/ { show=1; count=0 }
            /cmd LC_ID_DYLIB/ { show=1; count=0 }
            /cmd LC_REEXPORT_DYLIB/ { show=1; count=0 }
            show { print; count++; if (count >= 10) show=0 }
          ' \
            | tee ../diagnostics/HSObjC.load-commands.txt

          otool -L "$SHIM" \
            | tee ../diagnostics/HSObjC.linked-libraries.txt

          nm -gU "$SHIM" \
            | tee ../diagnostics/HSObjC.exported-symbols.txt

          for SYMBOL in _objc_alloc_init _objc_opt_self; do
            if ! grep -Eq "[[:space:]]${SYMBOL}$" \
              ../diagnostics/HSObjC.exported-symbols.txt; then

              echo "ERROR: HSObjC does not export $SYMBOL."
              exit 1
            fi
          done

          if ! grep -q 'LC_REEXPORT_DYLIB' ../diagnostics/HSObjC.load-commands.txt; then
            echo "ERROR: HSObjC does not re-export system libobjc."
            exit 1
          fi

          if ! grep -q '/usr/lib/libobjc.A.dylib' ../diagnostics/HSObjC.load-commands.txt; then
            echo "ERROR: HSObjC re-export does not point to system libobjc."
            exit 1
          fi

          # FlutterMacOS's original /usr/lib/libobjc.A.dylib load command
          # requires compatibility version 1.0.0. install_name_tool -change
          # preserves that requirement when redirecting the dependency to
          # HSObjC. A newly linked dylib defaults to current version 0.0.0,
          # which High Sierra dyld rejects as "Wrong version" even though the
          # file and symbols are otherwise correct. Require HSObjC to advertise
          # both compatibility and current version 1.0.0.
          HSOBJC_ID_LINE="$(
            otool -L "$SHIM" \
              | grep -F '@rpath/HSObjC.dylib (' \
              | head -1 \
              || true
          )"

          echo "HSObjC LC_ID_DYLIB: $HSOBJC_ID_LINE"

          if ! printf '%s\n' "$HSOBJC_ID_LINE" \
            | grep -Fq 'compatibility version 1.0.0, current version 1.0.0'; then

            echo "ERROR: HSObjC dylib version metadata is not 1.0.0/1.0.0."
            otool -L "$SHIM"
            exit 1
          fi

          codesign --force --sign - "$SHIM"

      - name: Backport FlutterMacOS engine binary
        working-directory: app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ../diagnostics

          FRAMEWORK="$APP/Contents/Frameworks/FlutterMacOS.framework"
          BINARY="$FRAMEWORK/Versions/A/FlutterMacOS"
          test -f "$BINARY"
          cp "$BINARY" ../diagnostics/FlutterMacOS.before-backport

          echo "============================================================"
          echo "FlutterMacOS BEFORE"
          echo "============================================================"
          file "$BINARY"
          lipo -archs "$BINARY"
          otool -l "$BINARY" | awk '
            /cmd LC_VERSION_MIN_MACOSX/ { show=1; count=0 }
            /cmd LC_BUILD_VERSION/ { show=1; count=0 }
            show { print; count++; if (count >= 10) show=0 }
          '
          otool -L "$BINARY"

          TMP="$BINARY.high-sierra"
          rm -f "$TMP"
          xcrun vtool \
            -set-version-min macos 10.13 15.2 \
            -replace \
            -output "$TMP" \
            "$BINARY"
          test -f "$TMP"
          mv "$TMP" "$BINARY"
          chmod +x "$BINARY"

          # ------------------------------------------------------------
          # Flutter 3.41.9's prebuilt FlutterMacOS was compiled for a
          # 10.15+ Objective-C runtime. Its Swift classes therefore use
          # FAST_IS_SWIFT_STABLE (class data bit 1). High Sierra's
          # objc4-723 predates that flag and recognizes Swift classes via
          # the legacy bit 0 instead. If left unchanged, 10.13 treats the
          # class metadata as an ordinary Objective-C class and crashes in
          # objc_allocWithZone while allocating FlutterRunLoop.
          #
          # Everything compiled by this workflow with a real 10.13 target
          # already uses the legacy bit automatically. Only the prebuilt
          # FlutterMacOS engine needs this metadata backport. Preserve every
          # pointer/layout byte and change only the runtime discriminator:
          #
          #     FAST_IS_SWIFT_STABLE  0b010
          #               ->
          #     FAST_IS_SWIFT_LEGACY  0b001
          #
          # The five unique stable Swift classes in Flutter 3.41.9 are:
          # FlutterRunLoop, ResizeSynchronizer, Logger, SyslogOutputWriter,
          # and StdoutOutputWriter. Fail closed if that count changes so a
          # future engine revision cannot be patched blindly.
          # ------------------------------------------------------------
          OBJDUMP="$(xcrun --find llvm-objdump)"
          test -x "$OBJDUMP"

          "$OBJDUMP" --macho --objc-meta-data "$BINARY" \
            > ../diagnostics/FlutterMacOS.objc-metadata.before.txt

          python3 - "$BINARY" <<'PY'
          import struct
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          blob = bytearray(path.read_bytes())

          CPU_TYPE_X86_64 = 0x01000007
          MH_MAGIC_64 = 0xFEEDFACF
          LC_SEGMENT_64 = 0x19
          EXPECTED_STABLE_CLASSES = 5

          def find_x86_64_slice(data):
              # FAT_MAGIC / FAT_MAGIC_64 are stored big-endian. The engine
              # artifact is currently a one-slice universal container, but
              # accept a genuinely thin x86_64 Mach-O as well.
              magic_bytes = bytes(data[:4])

              if magic_bytes == b"\xca\xfe\xba\xbe":
                  count = struct.unpack_from(">I", data, 4)[0]
                  for index in range(count):
                      entry = 8 + index * 20
                      cputype, _cpusubtype, offset, _size, _align = \
                          struct.unpack_from(">IIIII", data, entry)
                      if cputype == CPU_TYPE_X86_64:
                          return offset
                  raise SystemExit("ERROR: FlutterMacOS FAT binary has no x86_64 slice.")

              if magic_bytes == b"\xca\xfe\xba\xbf":
                  count = struct.unpack_from(">I", data, 4)[0]
                  for index in range(count):
                      entry = 8 + index * 32
                      cputype, _cpusubtype, offset, _size, _align, _reserved = \
                          struct.unpack_from(">IIQQII", data, entry)
                      if cputype == CPU_TYPE_X86_64:
                          return offset
                  raise SystemExit("ERROR: FlutterMacOS FAT64 binary has no x86_64 slice.")

              if struct.unpack_from("<I", data, 0)[0] == MH_MAGIC_64:
                  return 0

              raise SystemExit(
                  f"ERROR: Unsupported FlutterMacOS Mach-O magic: {magic_bytes.hex()}"
              )

          slice_base = find_x86_64_slice(blob)

          if struct.unpack_from("<I", blob, slice_base)[0] != MH_MAGIC_64:
              raise SystemExit("ERROR: x86_64 slice is not a 64-bit little-endian Mach-O.")

          (
              _magic,
              cputype,
              _cpusubtype,
              _filetype,
              ncmds,
              _sizeofcmds,
              _flags,
              _reserved,
          ) = struct.unpack_from("<IiiIIIII", blob, slice_base)

          if (cputype & 0xFFFFFFFF) != CPU_TYPE_X86_64:
              raise SystemExit(f"ERROR: selected slice has unexpected CPU type {cputype:#x}.")

          segments = []
          classlist = None
          command_offset = slice_base + 32

          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from("<II", blob, command_offset)

              if cmd == LC_SEGMENT_64:
                  segname = bytes(
                      blob[command_offset + 8 : command_offset + 24]
                  ).split(b"\0", 1)[0].decode("ascii", errors="replace")

                  vmaddr, vmsize, fileoff, filesize = struct.unpack_from(
                      "<QQQQ", blob, command_offset + 24
                  )
                  nsects = struct.unpack_from("<I", blob, command_offset + 64)[0]

                  segments.append((vmaddr, vmsize, fileoff, filesize, segname))

                  section_offset = command_offset + 72
                  for _section_index in range(nsects):
                      sectname = bytes(
                          blob[section_offset : section_offset + 16]
                      ).split(b"\0", 1)[0].decode("ascii", errors="replace")
                      section_segname = bytes(
                          blob[section_offset + 16 : section_offset + 32]
                      ).split(b"\0", 1)[0].decode("ascii", errors="replace")
                      address, size = struct.unpack_from(
                          "<QQ", blob, section_offset + 32
                      )
                      file_offset = struct.unpack_from(
                          "<I", blob, section_offset + 48
                      )[0]

                      if sectname == "__objc_classlist":
                          classlist = (
                              address,
                              size,
                              file_offset,
                              section_segname,
                          )

                      section_offset += 80

              command_offset += cmdsize

          if classlist is None:
              raise SystemExit("ERROR: FlutterMacOS has no __objc_classlist section.")

          def vm_to_file(vm_address):
              for vmaddr, _vmsize, fileoff, filesize, _segname in segments:
                  if vmaddr <= vm_address < vmaddr + filesize:
                      return slice_base + fileoff + (vm_address - vmaddr)
              raise SystemExit(
                  f"ERROR: Objective-C class VM address {vm_address:#x} is not file-backed."
              )

          _classlist_address, classlist_size, classlist_fileoff, _segname = classlist
          classlist_start = slice_base + classlist_fileoff

          stable = []
          unexpected_swift_flags = []

          for cursor in range(
              classlist_start,
              classlist_start + classlist_size,
              8,
          ):
              class_vmaddr = struct.unpack_from("<Q", blob, cursor)[0]
              if class_vmaddr == 0:
                  continue

              class_fileoff = vm_to_file(class_vmaddr)

              # objc_class on x86_64 is five machine words:
              # isa, superclass, cache, vtable, class_data_bits_t.
              bits_offset = class_fileoff + 4 * 8
              bits = struct.unpack_from("<Q", blob, bits_offset)[0]
              low_flags = bits & 0x7

              if low_flags == 0x2:
                  stable.append((class_vmaddr, bits_offset, bits))
              elif low_flags & 0x2:
                  # Do not guess how a future compiler combines the stable
                  # Swift marker with additional image-time class flags.
                  unexpected_swift_flags.append(
                      (class_vmaddr, bits, low_flags)
                  )

          print(f"Stable Swift classes found in FlutterMacOS: {len(stable)}")
          for class_vmaddr, bits_offset, bits in stable:
              print(
                  f"  class={class_vmaddr:#x} "
                  f"data_bits={bits:#x} "
                  f"file_offset={bits_offset:#x}"
              )

          if unexpected_swift_flags:
