name: Sync upstream LocalSend releases
# The synchronization workflow is intentionally release-driven: each run resolves the exact official release tag.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-upstream-release.yml"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional official LocalSend release tag to synchronize"
        required: false
        default: ""
        type: string
      force_sync:
        description: "Re-synchronize even if this release is already marked as synced"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: high-sierra-upstream-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync latest official release and start High Sierra backport
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout High Sierra repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Resolve official LocalSend release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag || '' }}
          FORCE_SYNC: ${{ inputs.force_sync || false }}
        run: |
          set -euo pipefail

          API_ROOT="https://api.github.com/repos/localsend/localsend"

          if [ -n "${REQUESTED_TAG:-}" ]; then
            if ! [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "ERROR: invalid LocalSend release tag: $REQUESTED_TAG"
              exit 1
            fi
            RELEASE_URL="$API_ROOT/releases/tags/$REQUESTED_TAG"
          else
            RELEASE_URL="$API_ROOT/releases/latest"
          fi

          curl --fail --silent --show-error --location \
            --retry 3 --retry-connrefused --retry-max-time 120 \
            --connect-timeout 15 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RUNNER_TEMP/localsend-release.json" \
            "$RELEASE_URL"

          TAG="$(
            python3 - "$RUNNER_TEMP/localsend-release.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text())
          if not isinstance(release, dict):
              raise SystemExit("ERROR: official release response must be a JSON object.")
          tag = release.get("tag_name")
          if not isinstance(tag, str) or not re.fullmatch(
              r"v[0-9]+\.[0-9]+\.[0-9]+(?:[.-][0-9A-Za-z][0-9A-Za-z.-]*)?", tag
          ):
              raise SystemExit("ERROR: official release has an invalid tag_name.")
          if release.get("draft") is not False:
              raise SystemExit("ERROR: official release must explicitly have draft=false.")
          if release.get("prerelease") is not False:
              raise SystemExit("ERROR: official release must explicitly have prerelease=false.")
          requested = os.environ.get("REQUESTED_TAG", "")
          if requested and tag != requested:
              raise SystemExit(f"ERROR: requested tag {requested} does not match response tag {tag}.")
          print(tag)
          PY
          )"

          CURRENT=""
          if [ -s .high-sierra/last-synced-release.txt ]; then
            CURRENT="$(tr -d '\r\n' < .high-sierra/last-synced-release.txt)"
          fi

          echo "Official release: $TAG"
          echo "Last synchronized release: ${CURRENT:-<none>}"

          if [ "$TAG" = "$CURRENT" ] && [ "${FORCE_SYNC}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch official release source
        id: source
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euxo pipefail

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/localsend/localsend.git
          git fetch --force --no-tags upstream \
            "refs/tags/${TAG}:refs/tags/__localsend_release"

          UPSTREAM_COMMIT="$(git rev-parse "refs/tags/__localsend_release^{commit}")"
          echo "Official release commit: $UPSTREAM_COMMIT"
          echo "commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Compose High Sierra release tree
        if: steps.release.outputs.changed == 'true'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euxo pipefail

          PARENT="$(git rev-parse HEAD)"
          KEEP_ROOT="$RUNNER_TEMP/high-sierra-preserve"

          rm -rf "$KEEP_ROOT"
          mkdir -p "$KEEP_ROOT/.github/workflows" "$KEEP_ROOT/.high-sierra"

          cp .github/workflows/macos-high-sierra.yml "$KEEP_ROOT/.github/workflows/macos-high-sierra.yml"
          cp .github/workflows/sync-upstream-release.yml "$KEEP_ROOT/.github/workflows/sync-upstream-release.yml"
          cp README.md "$KEEP_ROOT/README.md"
          cp .high-sierra/README.md "$KEEP_ROOT/.high-sierra/README.md"

          git read-tree --reset -u "$UPSTREAM_COMMIT"

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp "$KEEP_ROOT/.github/workflows/macos-high-sierra.yml" .github/workflows/macos-high-sierra.yml
          cp "$KEEP_ROOT/.github/workflows/sync-upstream-release.yml" .github/workflows/sync-upstream-release.yml
          cp "$KEEP_ROOT/README.md" README.md

          rm -rf .high-sierra
          mkdir -p .high-sierra
          cp "$KEEP_ROOT/.high-sierra/README.md" .high-sierra/README.md
          printf '%s\n' "$TAG" > .high-sierra/last-synced-release.txt
          printf '%s\n' "$UPSTREAM_COMMIT" > .high-sierra/source-base.txt
          printf '%s\n' "official-release" > .high-sierra/source-kind.txt

          # High Sierra is the only supported target.
          rm -rf app/android app/ios app/linux app/windows app/web cli server fastlane support

          rm -f .gitmodules \
            .github/release-drafter.yml \
            AGENTS.md CLAUDE.md CODE_SIGNING.md CONTRIBUTING.md CHANGELOG.md \
            app/.mcp.json app/macos/Podfile.lock app/assets/packaging/logo.ico

          find app/assets/i18n -type f \
            \( -name '_missing_translations_*.json' -o -name '_unused_translations.json' \) \
            -delete

          # Remove the deleted Cargo workspace members.
          if [ -f Cargo.toml ]; then
            sed -i.bak '/^[[:space:]]*"cli",[[:space:]]*$/d; /^[[:space:]]*"server",[[:space:]]*$/d' Cargo.toml
            rm -f Cargo.toml.bak
          fi

          # The isolate Rust crate only needs the Intel macOS target.
          RUST_TOOLCHAIN="packages/localsend_isolates/rust-toolchain.toml"
          if [ ! -f "$RUST_TOOLCHAIN" ]; then
            echo "ERROR: missing $RUST_TOOLCHAIN after upstream synchronization."
            exit 1
          fi
          sed -i.bak 's/^targets[[:space:]]*=.*/targets = ["x86_64-apple-darwin"]/' "$RUST_TOOLCHAIN"
          rm -f "$RUST_TOOLCHAIN.bak"

          if ! grep -Fq 'targets = ["x86_64-apple-darwin"]' "$RUST_TOOLCHAIN"; then
            echo "ERROR: failed to restrict Rust targets to x86_64-apple-darwin."
            exit 1
          fi

          APP_VERSION="$(awk '/^version:[[:space:]]/ {print $2; exit}' app/pubspec.yaml)"
          APP_RELEASE_VERSION="${APP_VERSION%%+*}"
          if [ "v${APP_RELEASE_VERSION}" != "$TAG" ]; then
            echo "ERROR: official tag $TAG does not match app version $APP_VERSION."
            exit 1
          fi

          git add -A

          EXPECTED_WORKFLOWS=$'macos-high-sierra.yml\nsync-upstream-release.yml'
          ACTUAL_WORKFLOWS="$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          if [ "$ACTUAL_WORKFLOWS" != "$EXPECTED_WORKFLOWS" ]; then
            echo "ERROR: unexpected workflow set after upstream synchronization:"
            printf '%s\n' "$ACTUAL_WORKFLOWS"
            exit 1
          fi

          FORBIDDEN_PATHS=(
            app/android app/ios app/linux app/windows app/web cli server fastlane support
            .gitmodules .github/release-drafter.yml
            AGENTS.md CLAUDE.md CODE_SIGNING.md CONTRIBUTING.md CHANGELOG.md
            app/.mcp.json app/macos/Podfile.lock app/assets/packaging/logo.ico
          )
          for path in "${FORBIDDEN_PATHS[@]}"; do
            if [ -e "$path" ]; then
              echo "ERROR: forbidden High Sierra cleanup path still exists: $path"
              exit 1
            fi
          done

          if find app/assets/i18n -type f \
            \( -name '_missing_translations_*.json' -o -name '_unused_translations.json' \) \
            -print -quit | grep -q .; then
            echo "ERROR: stale slang translation analysis files remain."
            exit 1
          fi

          if grep -Eq '^[[:space:]]*"cli",[[:space:]]*$|^[[:space:]]*"server",[[:space:]]*$' Cargo.toml; then
            echo "ERROR: deleted Cargo workspace members remain."
            exit 1
          fi

          # Check only the High Sierra changes against this official release.
          # Generated upstream files may already contain whitespace warnings.
          git -c core.whitespace=blank-at-eol,space-before-tab,-blank-at-eof diff --cached --check "$UPSTREAM_COMMIT" --

          TREE="$(git write-tree)"
          MESSAGE="Sync upstream LocalSend $TAG for High Sierra"

          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          if git merge-base --is-ancestor "$UPSTREAM_COMMIT" "$PARENT"; then
            NEW_COMMIT="$(printf '%s\n' "$MESSAGE" | git commit-tree "$TREE" -p "$PARENT")"
          else
            NEW_COMMIT="$(printf '%s\n' "$MESSAGE" | git commit-tree "$TREE" -p "$PARENT" -p "$UPSTREAM_COMMIT")"
          fi

          git reset --hard "$NEW_COMMIT"
          git push origin "$NEW_COMMIT:refs/heads/main"

      - name: Ensure High Sierra backport build and release was requested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          FORCE_SYNC: ${{ inputs.force_sync || false }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(git rev-parse HEAD)"

          if [ "${FORCE_SYNC}" != "true" ]; then
            # Only a real 404 means no published release exists; API failures must stop here.
            HTTP_STATUS="$(
              curl --silent --show-error --location \
                --retry 3 --retry-connrefused --retry-max-time 120 \
                --connect-timeout 15 --max-time 60 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --output "$RUNNER_TEMP/high-sierra-release.json" \
                --write-out '%{http_code}' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
            )"

            case "$HTTP_STATUS" in
              200)
                RELEASE_COMPLETE="$(
                  python3 - "$RUNNER_TEMP/high-sierra-release.json" "$TAG" <<'PY'
          import json
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text())
          tag = sys.argv[2]
          if not isinstance(release, dict) or release.get("tag_name") != tag:
              raise SystemExit("ERROR: High Sierra release response has an unexpected tag.")
          if any(type(release.get(key)) is not bool for key in ("draft", "prerelease")):
              raise SystemExit("ERROR: High Sierra release response has invalid release flags.")
          assets = release.get("assets")
          if not isinstance(assets, list) or any(
              not isinstance(asset, dict)
              or not isinstance(asset.get("name"), str)
              or not isinstance(asset.get("state"), str)
              or type(asset.get("size")) is not int
              or asset["size"] < 0
              for asset in assets
          ):
              raise SystemExit("ERROR: High Sierra release response has invalid assets.")
          archive = f"LocalSend-{tag[1:]}-macOS-High-Sierra-10.13-x86_64.zip"
          expected = {archive, f"{archive}.sha256"}
          uploaded = {
              asset["name"] for asset in assets
              if asset["state"] == "uploaded" and asset["size"] > 0
          }
          complete = not release["draft"] and not release["prerelease"] and expected <= uploaded
          print("true" if complete else "false")
          PY
                )"
                if [ "$RELEASE_COMPLETE" = "true" ]; then
                  echo "High Sierra $TAG is already published with its archive and checksum."
                  exit 0
                fi
                ;;
              404) ;;
              *)
                echo "ERROR: High Sierra release lookup returned HTTP $HTTP_STATUS."
                exit 1
                ;;
            esac
          fi

          find_existing_build() {
            if ! gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow macos-high-sierra.yml --all \
              --branch main --commit "$HEAD_SHA" --event workflow_dispatch \
              --limit 1 \
              --json databaseId,headSha,headBranch,event,status,conclusion,url \
              > "$RUNNER_TEMP/high-sierra-build-runs.json"; then
              echo "ERROR: could not check existing High Sierra build requests." >&2
              return 1
            fi

            python3 - "$RUNNER_TEMP/high-sierra-build-runs.json" "$HEAD_SHA" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          runs = json.loads(Path(sys.argv[1]).read_text())
          if not isinstance(runs, list):
              raise SystemExit("ERROR: build request response must be a JSON array.")
          for run in runs:
              if not isinstance(run, dict) or (
                  run.get("headSha") != sys.argv[2]
                  or run.get("headBranch") != "main"
                  or run.get("event") != "workflow_dispatch"
                  or type(run.get("databaseId")) is not int
                  or run["databaseId"] <= 0
              ):
                  raise SystemExit("ERROR: build request response does not match this source commit.")
          if runs:
              # A failed or cancelled build still counts: compatibility failures need a manual fix.
              print(f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{runs[0]['databaseId']}")
          PY
          }

          for attempt in 1 2 3 4 5; do
            EXISTING_BUILD="$(find_existing_build)"
            if [ -n "$EXISTING_BUILD" ]; then
              echo "High Sierra build already requested for $HEAD_SHA: $EXISTING_BUILD"
              exit 0
            fi

            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
            if [ "$REMOTE_HEAD" != "$HEAD_SHA" ]; then
              echo "ERROR: main changed from $HEAD_SHA to $REMOTE_HEAD; refusing to dispatch a different source commit."
              exit 1
            fi

            if gh workflow run macos-high-sierra.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f native_assets_strategy=native-backport \
              -f upstream_tag="$TAG" \
              -f publish_release=true; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Workflow dispatch attempt $attempt failed; rechecking before retrying."
              sleep 5
            fi
          done

          echo "ERROR: failed to dispatch High Sierra backport workflow."
          exit 1
